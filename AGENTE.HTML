        const extractTextFromFile = async (file) => {
            const ext = file.name.split('.').pop().toLowerCase();
            try {
                if (ext === 'pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let text = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(item => item.str).join(' ') + "\n";
                    }
                    return text;
                } else if (ext === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const res = await mammoth.extractRawText({ arrayBuffer });
                    return res.value;
                } else if (ext === 'xlsx' || ext === 'xls') {
                    const wb = XLSX.read(await file.arrayBuffer());
                    let text = "";
                    wb.SheetNames.forEach(s => text += XLSX.utils.sheet_to_txt(wb.Sheets[s]) + "\n");
                    return text;
                }
            } catch (e) { return `[Error procesando ${file.name}]`; }
            return "";
        };

                const url = simpleDecrypt(gScriptUrl); 
                if (!url) return;
                try {
                    const resp = await fetch(url); 
                    const data = await resp.json();
                    // Si el timestamp de la nube es mayor o el historial local está vacío, actualizamos
                    if (data.timestamp > localTimestamp || (data.peticionHistory && peticionHistory.length === 0)) {
                        if(data.agents) setAgents(data.agents); 
                        if(data.templates) setTemplates(data.templates);
                        if(data.peticionHistory) setPeticionHistory(data.peticionHistory);
                        if(data.apiKey) setApiKey(data.apiKey); 
                        if(data.appPin) setAppPin(data.appPin);
                        if(data.aiModel) setAiModel(data.aiModel);
                        if(data.availableModels) setAvailableModels(data.availableModels);
                        setLocalTimestamp(data.timestamp || Date.now());
                    }
                } catch (e) { console.error("Error en sincronización:", e); }
            };

            
            const testConnection = async () => {
                if(!apiKey) return alert("Introduce clave.");
                setTestStatus('loading');
                try { await callGemini("OK", aiModel); setTestStatus('success'); setTimeout(()=>setTestStatus(null), 3000); } catch(e) { setTestStatus('error'); }

                const a = document.createElement('a'); a.href = url; a.download = `BG_Backup.json`; a.click();

            const handleImportBackup = (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const d = JSON.parse(ev.target.result);
                        if(d.agents) setAgents(d.agents); if(d.templates) setTemplates(d.templates);
                        if(d.apiKey) setApiKey(d.apiKey); uploadToCloud(true);

{`function A_AUTORIZAR_AQUI() { DriveApp.getFiles(); UrlFetchApp.fetch("https://www.google.com"); }
function doPost(e) {

    var fileName = "BG_AGENTS_DB.json";
    var files = DriveApp.getFilesByName(fileName);
    var file = files.hasNext() ? files.next() : DriveApp.createFile(fileName, "{}", MimeType.PLAIN_TEXT);

    var backupFile = backupFiles.hasNext() ? backupFiles.next() : DriveApp.createFile(fileName + ".bak", "", MimeType.PLAIN_TEXT);
    backupFile.setContent(file.getBlob().getDataAsString());
    file.setContent(JSON.stringify(data));
    return ContentService.createTextOutput(JSON.stringify({status:"success", ts: data.timestamp})).setMimeType(ContentService.MimeType.JSON);
  } catch(err) { return ContentService.createTextOutput(JSON.stringify({status:"error"})); } 
  finally { lock.releaseLock(); }
}
function doGet(e) {
  var target = e.parameter.restoreBak === "true" ? "BG_AGENTS_DB.json.bak" : "BG_AGENTS_DB.json";
  var files = DriveApp.getFilesByName(target);
  if (files.hasNext()) return ContentService.createTextOutput(files.next().getBlob().getDataAsString()).setMimeType(ContentService.MimeType.JSON);
  return ContentService.createTextOutput(JSON.stringify({timestamp:0})).setMimeType(ContentService.MimeType.JSON);
}`}

                                    <h2 className="text-xl font-bold mb-6 uppercase tracking-widest text-white">Entorno</h2>
                                    <div className="bg-black/40 p-6 rounded-2xl border border-slate-700">
                                        <label className="block text-xs font-bold text-slate-500 mb-3 uppercase tracking-widest">Hash de Instalación</label>
                                        <div className="flex gap-3">
                                            <input type="text" id="licInputHash" placeholder="XXXX-XXXX" className="flex-1 bg-slate-900 border border-slate-700 p-3 font-mono text-white uppercase outline-none focus:border-green-500" />
                                            <button onClick={()=>{const v=document.getElementById('licInputHash').value; if(_0x8f(v)){_s_set(_0xT); uploadToCloud(true); alert("VALIDADO");}else{alert("ERROR");}}} className="bg-blue-600 px-8 rounded-xl font-black text-xs uppercase hover:bg-blue-500 transition-all text-white shadow-lg">Verificar</button>
                                        </div>
                                        {_0xAuth && <div className="mt-4 text-green-400 text-[10px] font-black tracking-widest animate-pulse flex items-center gap-2 uppercase"><Icons.CheckCircle/> Sistema Activo</div>}
                                    </div>
                                </div>

                                {/* PIE EXACTO BOLSA */}
                                <div className="text-center bg-slate-800/50 p-6 rounded-2xl max-w-2xl w-full mb-10 mx-auto border border-slate-700 shadow-inner">
                                    <p className="text-xs text-slate-400 mb-4 leading-relaxed">Esta plataforma es un proyecto independiente sustentado exclusivamente mediante <strong className="text-slate-300">crowdfunding</strong> y las aportaciones directas de sus usuarios.</p>
                                    <p className="text-xs text-slate-400 mb-3 border-t border-slate-700 pt-5 font-bold uppercase tracking-widest">Colabora con el proyecto:</p>
                                    <a href="https://x.com/BoardingGate" target="_blank" className="inline-flex items-center gap-2 text-blue-400 hover:text-blue-300 font-bold transition-colors bg-blue-900/20 px-6 py-2 rounded-xl border border-blue-500/30 uppercase text-xs tracking-widest shadow-lg"><Icons.Globe/> @BoardingGate en X</a>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="shrink-0 bg-slate-900 border-t border-slate-800 py-1.5 px-6 flex justify-between items-center text-[8px] text-slate-500 font-bold uppercase tracking-[0.2em]">
                        <div>BoardingGate Agent v2.6 (Cybernetic Orchestrator)</div>
                        <div className="flex gap-6">
                            <span>Sincronización: {syncStatus==='synced'?'Drive OK':'Local'}</span>
                            <span>Licencia: {_0xAuth?'ACTIVA':'RESTRINGIDA'}</span>
                        </div>
                    </footer>
                </div>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
