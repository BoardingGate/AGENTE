        const extractTextFromFile = async (file) => {
            const ext = file.name.split('.').pop().toLowerCase();
            try {
                if (ext === 'pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let text = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(item => item.str).join(' ') + "\n";
                    }
                    return text;
                } else if (ext === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const res = await mammoth.extractRawText({ arrayBuffer });
                    return res.value;
                } else if (ext === 'xlsx' || ext === 'xls') {
                    const arrayBuffer = await file.arrayBuffer();
                    const wb = XLSX.read(arrayBuffer);
                    let text = "";
                    wb.SheetNames.forEach(s => text += XLSX.utils.sheet_to_txt(wb.Sheets[s]) + "\n");
                    return text;
                }
            } catch (e) { return `[Error procesando ${file.name}]`; }
            return "";
        };

        const App = () => {

            // Variables de Datos

            // UI State

            const [enteredPin, setEnteredPin] = useState('');
            const [loading, setLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState('');

            // Dashboard

            const [resultado, setResultado] = useState('');
            const [tempPin, setTempPin] = useState(appPin || '');
            const [pinVisible, setPinVisible] = useState(false);

            const _0xAuth = useMemo(() => _s_st === _0xT, [_s_st]);

            // ================= FUNCIONES =================

            const callGemini = async (prompt, model, useSearch = false) => {
                const body = { contents: [{ parts: [{ text: prompt }] }] };
                if (useSearch) body.tools = [{ google_search: {} }];
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text;
            };

            const procesarPeticion = async () => {
                if(!apiKey) { alert("Ve a Ajustes y configura tu API Key."); return setActiveTab('settings'); }
                setLoading(true); setResultado('');
                try {
                    setStatusMsg("Extrayendo texto...");
                    let contextDoc = "";
                    for(const f of archivos) contextDoc += `\n--- FICHERO: ${f.name} ---\n${await extractTextFromFile(f)}\n`;

                    setStatusMsg("Orquestador analizando ruta...");
                    const routerPrompt = `Petición: "${peticion}". Agentes: ${JSON.stringify(agents.map(a=>a.nombre))}. Plantillas: ${JSON.stringify(templates.map(t=>t.nombre))}. Responde JSON exacto: {"agente":"nombre","plantilla":"nombre","internet":boolean,"busqueda":"query"}`;
                    const routerRes = await callGemini(routerPrompt, aiModel);
                    const decision = JSON.parse(routerRes.match(/\{[\s\S]*\}/)[0]);

                    let internet = "";
                    if(decision.internet) {
                        setStatusMsg("Buscando en la red...");
                        internet = await callGemini(`Briefing de internet sobre: ${decision.busqueda}`, aiModel, true);
                    }

                    setStatusMsg(`Ejecutando Agente: ${decision.agente}...`);
                    const ag = agents.find(a=>a.nombre===decision.agente) || agents[0];
                    const tp = templates.find(t=>t.nombre===decision.plantilla) || templates[0];
                    const finalRes = await callGemini(`ROL: ${ag.instrucciones}\nPLANTILLA: ${tp.descripcion}\nESTILO/EJEMPLO: ${tp.ejemplo || ''}\nINTERNET: ${internet}\nDOCUMENTOS: ${contextDoc}\nPETICION: ${peticion}`, aiModel);
                    setResultado(finalRes);
                } catch(e) { alert("Error: " + e.message); } finally { setLoading(false); setStatusMsg(''); }
            };

            const testConnection = async () => {
                if(!apiKey) return alert("Introduce la API Key.");

                    await callGemini("Responde solo OK", aiModel);
                    setTestStatus('success');
                    setTimeout(() => setTestStatus(null), 3000);
                } catch(e) { setTestStatus('error'); alert(e.message); }
            };

            const uploadToCloud = async () => {
                const url = simpleDecrypt(gScriptUrl);

                    alert("Sincronización en GDrive completada.");
                } catch (e) { setSyncStatus('error'); alert("Error sync: " + e.message); }
            };

            const downloadFromCloud = async () => {
                const url = simpleDecrypt(gScriptUrl);
                if (!url) return;
                try {
                    const resp = await fetch(url);
                    const d = await resp.json();
                    if (d.timestamp > 0) {
                        if(d.agents) setAgents(d.agents);
                        if(d.templates) setTemplates(d.templates);
                        if(d.apiKey) setApiKey(d.apiKey);
                        if(d.aiModel) setAiModel(d.aiModel);
                        if(d.availableModels) setAvailableModels(d.availableModels);
                        if(d.appPin) setAppPin(d.appPin);
                        if(d._s_st) _s_set(d._s_st);
                        setLocalTimestamp(d.timestamp); setSyncStatus('synced');
                    }
                } catch (e) { console.error("Error nube", e); }
            };

            const handleExport = () => {
                const data = { agents, templates, apiKey, aiModel, availableModels, appPin, _s_st, ts: localTimestamp };
                const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `BoardingGate_Backup_Agents.json`; a.click();
            };

            const handleImport = (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const d = JSON.parse(ev.target.result);
                        if(d.agents) setAgents(d.agents);
                        if(d.templates) setTemplates(d.templates);
                        if(d.apiKey) setApiKey(d.apiKey);
                        if(d.aiModel) setAiModel(d.aiModel);
                        if(d.availableModels) setAvailableModels(d.availableModels);
                        alert("Backup local restaurado.");
                    } catch(e) { alert("Archivo corrupto."); }
                };
                reader.readAsText(file);
            };

            const handleRestoreBak = async () => { 
                if (!gScriptUrl) return alert("Configura la URL de Google Script primero."); 
                if (!confirm("⚠️ IMPORTANTE:\n\nEsta acción descargará la COPIA DE SEGURIDAD ANTERIOR (.bak) de Google Drive y reemplazará toda tu configuración actual.\n\n¿Estás seguro de continuar?")) return; 
                setSyncStatus('syncing'); 
                try { 
                    const url = simpleDecrypt(gScriptUrl); 
                    const response = await fetch(`${url}?restoreBak=true&_t=${Date.now()}`); 
                    const textData = await response.text(); 
                    if (textData.includes("<html") || textData.includes("Sign in - Google")) throw new Error("Error de permisos. El script está bloqueado."); 
                    const data = JSON.parse(textData); 
                    if (!data || data.timestamp === 0 || !data.agents) throw new Error("No hay copia válida en Drive."); 
                    
                    if(data.agents) setAgents(data.agents);
                    if(data.templates) setTemplates(data.templates);
                    if(data.apiKey) setApiKey(data.apiKey);
                    if(data.aiModel) setAiModel(data.aiModel);
                    if(data.availableModels) setAvailableModels(data.availableModels);
                    
                    setSyncStatus('synced'); alert("✅ Copia anterior (.bak) restaurada."); 
                } catch (e) { alert("Error al restaurar: " + e.message); setSyncStatus('error'); } 
            };

            useEffect(() => { if(gScriptUrl) downloadFromCloud(); }, []);

            // ================= RENDERIZADO =================

                                        <label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">Hash de Instalación</label>

                                            <input type="text" id="licInputHash" placeholder="XXXX-XXXX" className={`flex-1 bg-slate-900 border ${_0xAuth ? 'border-green-600' : 'border-slate-600'} rounded-lg p-3 text-white font-mono focus:outline-none uppercase`} />
                                            <button onClick={() => { const v = document.getElementById('licInputHash').value; if(_0x8f(v)) { _s_set(_0xT); alert("R-KEY: OK."); } else { alert("R-KEY: ERR."); } }} className="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold text-xs">VERIFICAR</button>
                                        </div>
                                        {_0xAuth && <div className="mt-3 text-center text-green-400 text-xs font-bold uppercase tracking-widest">● SISTEMA VALIDADO</div>}
                                    </div>
                                </div>

                                {/* PIE CROWDFUNDING */}
                                <div className="text-center bg-slate-800/50 p-4 rounded-xl max-w-2xl w-full mb-10 mx-auto">
                                    <p className="text-xs text-slate-400 mb-4 leading-relaxed">Esta plataforma es un proyecto independiente sustentado mediante <strong className="text-slate-300">crowdfunding</strong>.</p>
                                    <p className="text-xs text-slate-400 mb-2 border-t border-slate-700 pt-4">Para obtener tu Nº de registro o colaborar:</p>
                                    <a href="https://x.com/BoardingGate" target="_blank" className="inline-flex items-center gap-2 text-blue-400 hover:text-blue-300 font-bold transition-colors"><Icons.Globe/> @BoardingGate en X</a>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="shrink-0 bg-slate-900 border-t border-slate-800 py-1.5 px-6 flex justify-between items-center text-[8px] text-slate-500 font-bold uppercase tracking-[0.2em]">
                        <div>BoardingGate Agent v1.5 (Final)</div>
                        <div className="flex gap-6">
                            <span>Sincronización: {syncStatus==='synced'?'Nube OK':'Local'}</span>
                            <span>Licencia: {_0xAuth?'ACTIVA':'RESTRINGIDA'}</span>
                        </div>
                    </footer>
                </div>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
