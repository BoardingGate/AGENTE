                    </head><body>
                    <h2>INFORME GENERADO POR IA</h2>
                    <div style="font-size:11px; margin-bottom:20px; color:#555;">
                        <b>Agente(s):</b> ${infoOrquestador?.agentes} | <b>Plantilla:</b> ${infoOrquestador?.plantilla} | <b>Fecha:</b> ${new Date().toLocaleString()}
                    </div>
                    ${resultado}
                    <div class="footer">Documento generado vía BoardingGate Multi-Agente. Las iA pueden cometer errores. Verifique los datos con las fuentes enlazadas.</div>
                    </body></html>
                `);
                w.document.close();
                setTimeout(() => w.print(), 500);
            };

            const handleExportWord = () => {
                const preHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML To Doc</title></head><body>";
                const postHtml = "</body></html>";
                const html = preHtml + resultado + postHtml;
                const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
                const url = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(html);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Informe_IA.doc';
                a.click();
            };

            const handleExportExcel = () => {
                const text = extractRawTextFromHTML(resultado);
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet([[text]]); // Lo mete todo en la primera celda
                XLSX.utils.book_append_sheet(wb, ws, "Informe");
                XLSX.writeFile(wb, "Informe_IA.xlsx");
            };


            // ================= LÓGICA DE SINCRONIZACIÓN (NUBE) =================

            const uploadToCloud = useCallback(async (isAuto = false) => {
                const url = simpleDecrypt(gScriptUrl);
                if (!url) { if (!isAuto) alert("Configura primero la URL de GDrive en Ajustes."); return; }
                setSyncStatus('syncing');
                try {
                    const now = Date.now();
                    const payload = { timestamp: now, agents, templates, apiKey, aiModel, availableModels, appPin, _s_st };
                    await fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                    setLocalTimestamp(now);
                    setSyncStatus('synced');
                    if (!isAuto) alert("✅ Guardado en Google Drive.");
                } catch (e) {
                    setSyncStatus('error');
                    if (!isAuto) alert("Error de subida: " + e.message);
                }
            }, [agents, templates, apiKey, aiModel, availableModels, appPin, _s_st, gScriptUrl]);

            const downloadFromCloud = async () => {
                const url = simpleDecrypt(gScriptUrl);
                if (!url) { setIsAppReady(true); return; }
                try {
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.timestamp > localTimestamp) {
                        if(data.agents) setAgents(data.agents);
                        if(data.templates) setTemplates(data.templates);
                        if(data.apiKey) setApiKey(data.apiKey);
                        if(data.aiModel) setAiModel(data.aiModel);
                        if(data.availableModels) setAvailableModels(data.availableModels);
                        if(data.appPin) setAppPin(data.appPin);
                        if(data._s_st) _s_set(data._s_st);
                        setLocalTimestamp(data.timestamp);
                    }
                    setSyncStatus('synced');
                } catch (e) { setSyncStatus('error'); } finally { setIsAppReady(true); }
            };

            const handleExportBackup = () => {
                const data = { agents, templates, apiKey, aiModel, availableModels, appPin, _s_st, ts: localTimestamp };
                const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `BoardingGate_Backup_Agents.json`; a.click();
            };

            const handleImportBackup = (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const d = JSON.parse(ev.target.result);
                        if(d.agents) setAgents(d.agents); if(d.templates) setTemplates(d.templates);
                        if(d.apiKey) setApiKey(d.apiKey); if(d.aiModel) setAiModel(d.aiModel);
                        if(d.availableModels) setAvailableModels(d.availableModels);
                        setLocalTimestamp(Date.now()); 
                        setTimeout(() => uploadToCloud(true), 500); 
                        alert("Restauración completada.");
                    } catch(err) { alert("Archivo corrupto."); }
                };
                reader.readAsText(file);
            };

            const handleRestoreBak = async () => { 
                if (!gScriptUrl) return alert("Configura la URL de Google Script primero."); 
                if (!confirm("⚠️ Se descargará el Backup anterior (.bak) de Drive. ¿Continuar?")) return; 
                setSyncStatus('syncing'); 
                try { 
                    const url = simpleDecrypt(gScriptUrl); 
                    const response = await fetch(`${url}?restoreBak=true&_t=${Date.now()}`); 
                    const textData = await response.text(); 
                    const data = JSON.parse(textData); 
                    if (!data || data.timestamp === 0) throw new Error("No hay .bak válido."); 
                    if(data.agents) setAgents(data.agents); if(data.templates) setTemplates(data.templates);
                    setLocalTimestamp(Date.now()); setTimeout(() => uploadToCloud(true), 500);
                    setSyncStatus('synced'); alert("✅ Backup restaurado."); 
                } catch (e) { alert("Error: " + e.message); setSyncStatus('error'); } 
            };

            useEffect(() => { downloadFromCloud(); }, []);


            // ================= RENDERIZADO UI =================

            if(!isAppReady) {
                return (
                    <div className="h-full flex flex-col items-center justify-center bg-[#0a0a0a] text-white p-4">
                        <Icons.Loader className="animate-spin text-blue-500 w-12 h-12 mb-4"/>
                        <div className="text-sm font-bold tracking-widest uppercase">Cargando Sistema...</div>
                    </div>
                );
            }

            if(isPinLocked) {
                return (
                    <div className="h-full flex flex-col items-center justify-center bg-[#0a0a0a] text-white p-4">
                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full">
                            <div className="text-blue-600 mb-6 flex justify-center"><Icons.Brain size={40}/></div>
                            <h2 className="text-2xl font-bold font-['Orbitron'] tracking-widest mb-6">BoardingGate</h2>
                            <input type="password" value={enteredPin} onChange={e => { const val = e.target.value.slice(0,4); setEnteredPin(val); if(val === appPin) setIsPinLocked(false); }} placeholder="PIN" className="w-full bg-black/50 border border-slate-700 rounded-xl p-4 text-center text-3xl font-mono tracking-[1em] text-white focus:outline-none focus:border-blue-500" autoFocus />
                        </div>
                    </div>
                );
            }

            return (
                <div id="root">
                    <header className="shrink-0 bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center z-50">
                        <div>
                            <h1 className="text-2xl font-bold font-['Orbitron'] tracking-tighter">Boarding<span className="text-blue-600">Gate</span></h1>
                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-[0.3em]">Multi-Agente iA</p>
                        </div>
                        <nav className="flex bg-slate-800 rounded-xl p-1 gap-1 border border-slate-700 overflow-x-auto custom-scrollbar whitespace-nowrap">
                            <button onClick={() => setActiveTab('dashboard')} className={`px-5 py-2.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 transition-all ${activeTab === 'dashboard' ? 'active-tab' : 'text-slate-400 hover:text-white'}`}><Icons.Brain/> Consola Dashboard</button>
                            <button onClick={() => setActiveTab('agentes')} className={`px-5 py-2.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 transition-all ${activeTab === 'agentes' ? 'active-tab' : 'text-slate-400 hover:text-white'}`}><Icons.Users/> Agentes</button>
                            <button onClick={() => setActiveTab('plantillas')} className={`px-5 py-2.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 transition-all ${activeTab === 'plantillas' ? 'active-tab' : 'text-slate-400 hover:text-white'}`}><Icons.FileText/> Plantillas</button>
                            <button onClick={() => setActiveTab('settings')} className={`px-5 py-2.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 transition-all ${activeTab === 'settings' ? 'active-tab' : 'text-slate-400 hover:text-white'}`}><Icons.Settings/> Ajustes</button>
                        </nav>
                    </header>

                    <main className="flex-1 overflow-y-auto custom-scrollbar p-6">
                        {loading && (

                                <div className="text-xl font-bold text-white uppercase tracking-widest animate-pulse">{statusMsg}</div>
                            </div>
                        )}

                        {/* ================= DASHBOARD ================= */}
                        {activeTab === 'dashboard' && (
                            <div className="max-w-5xl mx-auto space-y-6 fade-in pb-10">
                                <div className="glass-panel p-8 rounded-3xl space-y-6 shadow-2xl">
                                    <div className="flex justify-between items-center text-xs font-black uppercase text-blue-400 tracking-widest">
                                        <span>Terminal de Misiones</span>
                                        <select value={aiModel} onChange={e=>{setAiModel(e.target.value); uploadToCloud(true);}} className="text-[10px] font-bold px-3 py-1 bg-slate-900 border-slate-700 text-white rounded outline-none">{availableModels.map(m=><option key={m} value={m}>{m}</option>)}</select>
                                    </div>
                                    
                                    <textarea value={peticion} onChange={e=>setPeticion(e.target.value)} placeholder="Escribe aquí tu petición. El orquestador analizará qué Agente(s) debe intervenir y bajo qué formato..." className="w-full h-44 bg-slate-950 border border-slate-700 rounded-2xl p-6 text-sm leading-relaxed outline-none focus:border-blue-500" />
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <label className="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 rounded-2xl p-8 cursor-pointer hover:border-blue-500 transition-all bg-slate-800/20 group">
                                            <input type="file" multiple onChange={e=>setArchivos([...archivos, ...Array.from(e.target.files)])} className="hidden" />
                                            <div className="text-slate-500 mb-3 group-hover:scale-110 transition-transform"><Icons.Upload size={40}/></div>
                                            <span className="text-[10px] uppercase font-black text-slate-500">Documentos Multi-Formato</span>
                                        </label>
                                        <button onClick={procesarMision} className="bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black uppercase text-xs tracking-widest shadow-2xl active:scale-95 transition-all">Ejecutar Misión</button>
                                    </div>

                                    {archivos.length > 0 && (
                                        <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-800">
                                            {archivos.map((f, i) => <div key={i} className="bg-blue-900/40 border border-blue-500/30 px-3 py-1 rounded-full text-[9px] font-bold text-blue-300 flex items-center">{f.name} <button onClick={()=>setArchivos(archivos.filter((_,x)=>x!==i))} className="ml-2 text-white font-bold hover:text-red-400">✕</button></div>)}
                                        </div>
                                    )}
                                </div>

                                {resultado && (
                                    <div className="glass-panel p-10 rounded-3xl border-l-4 border-l-blue-500 fade-in shadow-2xl relative">
                                        
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700 pb-4 mb-6">
                                            <div className="mb-4 md:mb-0">
                                                <h4 className="text-blue-400 font-black text-xs uppercase tracking-widest mb-2">Informe Generado</h4>
                                                {infoOrquestador && (
                                                    <div className="flex gap-2 text-[9px] font-bold">
                                                        <span className="bg-slate-800 px-2 py-1 rounded text-purple-400">Agente: {infoOrquestador.agentes}</span>
                                                        <span className="bg-slate-800 px-2 py-1 rounded text-green-400">Plantilla: {infoOrquestador.plantilla}</span>
                                                        {infoOrquestador.internet === 'Sí' && <span className="bg-blue-900/30 px-2 py-1 rounded text-blue-400 flex items-center gap-1"><Icons.Globe/> Internet Usado</span>}
                                                    </div>
                                                )}
                                            </div>
                                            
                                            <div className="flex flex-wrap gap-2">
                                                <button onClick={()=>navigator.clipboard.writeText(extractRawTextFromHTML(resultado))} className="text-[10px] font-black bg-slate-800 px-4 py-2 rounded-lg hover:bg-slate-700 border border-slate-700 uppercase transition-all">COPIAR</button>
                                                <button onClick={handleExportWord} className="text-[10px] font-black bg-blue-900/40 text-blue-300 px-4 py-2 rounded-lg hover:bg-blue-800/50 border border-blue-500/30 uppercase transition-all flex items-center gap-1"><Icons.Download/> DOC</button>
                                                <button onClick={handleExportExcel} className="text-[10px] font-black bg-green-900/40 text-green-300 px-4 py-2 rounded-lg hover:bg-green-800/50 border border-green-500/30 uppercase transition-all flex items-center gap-1"><Icons.Download/> EXCEL</button>
                                                <button onClick={handleExportPrint} className="text-[10px] font-black bg-purple-900/40 text-purple-300 px-4 py-2 rounded-lg hover:bg-purple-800/50 border border-purple-500/30 uppercase transition-all flex items-center gap-1"><Icons.ExternalLink/> PDF / IMPRIMIR</button>
                                            </div>
                                        </div>

                                        <div className="ai-result-container" dangerouslySetInnerHTML={{ __html: resultado }}></div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ================= AGENTES ================= */}
                        {activeTab === 'agentes' && (
                            <div className="max-w-5xl mx-auto space-y-6 fade-in pb-10">
                                <div className="flex justify-between items-center"><h2 className="text-xl font-bold tracking-tight">Catálogo de Especialistas</h2><button onClick={()=>{setAgents([...agents, {id:Date.now(), nombre:'Nuevo Agente', instrucciones:''}]); uploadToCloud(true);}} className="bg-blue-600 hover:bg-blue-500 px-6 py-2.5 rounded-xl text-[10px] font-black uppercase shadow-lg shadow-blue-900/20 transition-all flex items-center gap-1"><Icons.Plus/> Crear Agente</button></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">{agents.map((ag, i) => (
                                    <div key={ag.id} className="glass-panel p-6 rounded-2xl space-y-4 shadow-xl border border-white/5">
                                        <input value={ag.nombre} onChange={e=>{const n=[...agents]; n[i].nombre=e.target.value; setAgents(n);}} onBlur={()=>uploadToCloud(true)} className="w-full text-blue-400 font-black uppercase text-sm bg-black/40 border-none focus:outline-none focus:border-blue-500" />
                                        <textarea value={ag.instrucciones} onChange={e=>{const n=[...agents]; n[i].instrucciones=e.target.value; setAgents(n);}} onBlur={()=>uploadToCloud(true)} placeholder="Instrucciones estrictas para la IA..." className="w-full h-40 text-xs leading-relaxed focus:outline-none focus:border-blue-500" />
                                        <button onClick={()=>{setAgents(agents.filter(x=>x.id!==ag.id)); setTimeout(()=>uploadToCloud(true),200);}} className="text-red-500 text-[10px] font-black uppercase hover:text-red-400 transition-colors flex items-center gap-1"><Icons.Trash2/> Eliminar Agente</button>
                                    </div>
                                ))}</div>
                            </div>
                        )}

                        {/* ================= PLANTILLAS ================= */}
                        {activeTab === 'plantillas' && (
                            <div className="max-w-5xl mx-auto space-y-6 fade-in pb-10">
                                <div className="flex justify-between items-center"><h2 className="text-xl font-bold">Biblioteca de Formatos</h2><button onClick={()=>{setTemplates([...templates, {id:Date.now(), nombre:'Nueva Plantilla', descripcion:'', ejemplo:''}]); uploadToCloud(true);}} className="bg-purple-600 hover:bg-purple-500 px-6 py-2.5 rounded-xl text-[10px] font-black uppercase shadow-lg transition-all flex items-center gap-1"><Icons.Plus/> Crear Modelo</button></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">{templates.map((t, i) => (
                                    <div key={t.id} className="glass-panel p-6 rounded-2xl space-y-4 shadow-xl border border-white/5">
                                        <input value={t.nombre} onChange={e=>{const n=[...templates]; n[i].nombre=e.target.value; setTemplates(n);}} onBlur={()=>uploadToCloud(true)} className="w-full text-purple-400 font-black uppercase text-sm bg-black/40 border-none focus:outline-none focus:border-purple-500" />
                                        <textarea value={t.descripcion} onChange={e=>{const n=[...templates]; n[i].descripcion=e.target.value; setTemplates(n);}} onBlur={()=>uploadToCloud(true)} placeholder="Instruye cómo deben mostrarse los datos..." className="w-full h-28 text-xs leading-relaxed focus:outline-none focus:border-purple-500" />
                                        <div className="p-4 bg-black/40 rounded-2xl border border-slate-800">
                                            <label className="text-[9px] font-black text-slate-500 uppercase block mb-2 tracking-widest text-center cursor-pointer">Aprender estilo de un archivo</label>
                                            <input type="file" onChange={async e=>{
                                                setLoading(true);
                                                const txt = await extractTextFromFile(e.target.files[0]);
                                                const n=[...templates]; n[i].ejemplo=txt.substring(0,8000); setTemplates(n);
                                                uploadToCloud(true);
                                                setLoading(false); alert("Estilo copiado.");
                                            }} className="text-[10px] w-full text-slate-500 cursor-pointer" />
                                        </div>
                                        <button onClick={()=>{setTemplates(templates.filter(x=>x.id!==t.id)); setTimeout(()=>uploadToCloud(true),200);}} className="text-red-500 text-[10px] font-black uppercase hover:text-red-400 transition-colors flex items-center gap-1"><Icons.Trash2/> Eliminar Modelo</button>
                                    </div>
                                ))}</div>
                            </div>
                        )}

                        {/* ================= AJUSTES ================= */}
                        {activeTab === 'settings' && (
                            <div className="max-w-2xl mx-auto space-y-8 fade-in pb-10">
                                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
                                    <div className="flex items-center gap-4 mb-6 border-b border-slate-700 pb-4"><div className="p-3 bg-purple-500/20 rounded-xl text-purple-400 flex items-center justify-center"><Icons.Brain/></div><div><h2 className="text-2xl font-bold text-white">Configuración IA</h2><p className="text-slate-400 text-sm">Motores de Google Gemini</p></div></div>
                                    
                                    <label className="block text-sm font-bold text-slate-300 mb-2">Google Gemini API Key</label>
                                    <div className="relative mb-4">
                                        <input type={showKey ? "text" : "password"} value={apiKey} onChange={(e) => setApiKey(e.target.value)} onBlur={() => uploadToCloud(true)} placeholder="AIzaSy..." className="w-full bg-black/50 border border-slate-600 rounded-xl p-4 pr-12 text-white focus:border-purple-500 focus:outline-none font-mono"/>
                                        <button onClick={() => setShowKey(!showKey)} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">{showKey ? <Icons.EyeOff/> : <Icons.Eye/>}</button>
                                    </div>
                                    <div className="flex justify-end gap-3 items-center">
                                        <button onClick={testConnection} className={`h-[40px] px-6 rounded-xl border font-bold text-sm flex items-center gap-2 ${testStatus === 'success' ? 'bg-green-600 border-green-500 text-white' : testStatus === 'error' ? 'bg-red-600 border-red-500 text-white' : 'bg-slate-700 border-slate-600 text-slate-300'}`}>
                                            {testStatus === 'loading' ? <Icons.Loader/> : testStatus === 'success' ? <Icons.CheckCircle/> : 'PROBAR CONEXIÓN'}
                                        </button>
                                    </div>

                                    <div className="mb-6 border-t border-slate-700 pt-6">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-sm font-bold text-slate-300 uppercase tracking-wide">Modelo IA Activo</label>
                                            <span className="text-[10px] text-slate-500 font-mono">{aiModel}</span>
                                        </div>
                                        <select value={aiModel} onChange={(e) => {setAiModel(e.target.value); uploadToCloud(true);}} className="w-full bg-slate-800 border border-slate-600 rounded-xl p-3 text-white text-sm mb-4 font-mono outline-none">
                                            {availableModels.map(m => <option key={m} value={m}>{m}</option>)}
                                        </select>
                                        
                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                            <label className="block text-[10px] font-bold text-slate-500 mb-2 uppercase flex items-center gap-2"><Icons.Settings/> Gestión de Modelos</label>
                                            <div className="flex gap-2 mb-3">
                                                <input type="text" id="newModelInput" placeholder="ID del Modelo..." className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white font-mono focus:border-blue-500 outline-none"/>
                                                <button onClick={() => {
                                                    const inp = document.getElementById('newModelInput');
                                                    if(inp.value) { setAvailableModels(prev => [...prev, inp.value]); setAiModel(inp.value); inp.value = ''; setTimeout(()=>uploadToCloud(true), 200); }

                                            </div>
                                            
                                            <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar p-1">
                                                {availableModels.map(m => (
                                                    <div key={m} className={`group flex items-center gap-2 px-2 py-1.5 rounded border text-[10px] font-mono transition-all ${aiModel === m ? 'bg-blue-900/30 border-blue-500 text-blue-300 shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                                        <span className="truncate max-w-[150px]">{m}</span>

                                                            <button onClick={(e) => {
                                                                e.stopPropagation();
                                                                setAvailableModels(prev => { const nl = prev.filter(x=>x!==m); if(aiModel===m) setAiModel(nl[0]); setTimeout(()=>uploadToCloud(true),200); return nl; });

                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">

                                    </div>
                                    <div className="flex items-end gap-2 mb-6">
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">URL del Google Script</label>

                                        </div>
                                        <button onClick={()=>uploadToCloud()} className="bg-blue-600 hover:bg-blue-500 p-4 rounded-xl shadow-lg transition-all text-white border border-blue-500"><Icons.Refresh/></button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl border-t-2 border-t-red-600">
                                        <h3 className="text-xs font-black text-red-500 uppercase mb-4 tracking-widest flex items-center gap-2"><Icons.EyeOff/> Seguridad PIN</h3>
                                        <input type="password" value={appPin} onChange={e=>setAppPin(e.target.value.replace(/\D/g,'').slice(0,4))} onBlur={()=>uploadToCloud(true)} placeholder="PIN 4 DIGITOS" className="w-full bg-black/50 border border-slate-700 text-center text-3xl font-mono p-4 rounded-xl text-white focus:outline-none focus:border-red-500" />
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl flex flex-col justify-between gap-4 border-t-2 border-t-blue-600">
                                        <h3 className="text-xs font-black text-blue-500 uppercase tracking-widest flex items-center gap-2"><Icons.Upload/> Copias Locales</h3>
                                        <div className="space-y-3">
                                            <button onClick={handleExportBackup} className="w-full bg-slate-800 py-3 rounded-xl font-black text-[10px] uppercase border border-slate-700 transition-all text-white">Exportar JSON</button>
                                            <label className="w-full bg-blue-600 py-3 rounded-xl font-black text-[10px] uppercase text-center cursor-pointer transition-all text-white block">Importar JSON<input type="file" className="hidden" onChange={handleImportBackup} /></label>
                                            <button onClick={handleRestoreBak} className="w-full bg-indigo-600 py-3 rounded-xl font-black text-[10px] uppercase text-center cursor-pointer shadow-lg text-white transition-all flex items-center justify-center gap-2"><Icons.Refresh/> Restaurar (.bak)</button>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-900 p-10 rounded-3xl border border-slate-800 shadow-2xl border-l-4 border-l-green-500 relative overflow-hidden">
                                    <h2 className="text-xl font-bold mb-6 uppercase tracking-widest text-white">Estado del Sistema</h2>
                                    <div className="bg-black/40 p-6 rounded-2xl border border-slate-700">
                                        <label className="block text-xs font-bold text-slate-500 mb-3 uppercase tracking-widest">Hash de Instalación</label>
                                        <div className="flex gap-3">
                                            <input type="text" id="licInputHash" placeholder="XXXX-XXXX" className="flex-1 bg-slate-900 border border-slate-700 p-3 font-mono text-white rounded-lg focus:border-green-500 outline-none uppercase" />
                                            <button onClick={() => { const v = document.getElementById('licInputHash').value; if(_0x8f(v)) { _s_set(_0xT); uploadToCloud(true); alert("OK"); } else { alert("ERROR"); } }} className="bg-blue-600 px-8 rounded-xl font-black text-xs uppercase text-white shadow-lg">Verificar</button>
                                        </div>
                                        {_0xAuth && <div className="mt-4 text-green-400 text-[10px] font-black tracking-widest animate-pulse flex items-center gap-2"><Icons.CheckCircle/> SISTEMA ACTIVADO</div>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="shrink-0 bg-slate-900 border-t border-slate-800 py-1.5 px-6 flex justify-between items-center text-[8px] text-slate-500 font-bold uppercase tracking-[0.2em]">
                        <div>BoardingGate Agent v2.0 (Zero-Hallucination Engine)</div>
                        <div className="flex gap-6">
                            <span className={syncStatus === 'syncing' ? 'text-yellow-500 animate-pulse' : ''}>
                                Nube: {syncStatus==='synced'?'OK':syncStatus==='syncing'?'Guardando...':'Local'}
                            </span>
                            <span>Licencia: {_0xAuth?'ACTIVA':'RESTRINGIDA'}</span>
                        </div>
                    </footer>
                </div>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
