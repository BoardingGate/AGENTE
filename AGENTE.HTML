            File: (p) => <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" {...p}><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>,
            Check: (p) => <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" {...p}><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>,

        };

        // --- EXTRACCIÓN DE TEXTO ---
        const extractText = async (file) => {
            const ext = file.name.split('.').pop().toLowerCase();
            try {
                if (ext === 'pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let text = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(item => item.str).join(' ') + "\n";
                    }
                    return text;
                } else if (ext === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    return result.value;
                } else if (ext === 'xlsx' || ext === 'xls') {
                    const arrayBuffer = await file.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer);
                    let text = "";
                    workbook.SheetNames.forEach(sheet => { text += XLSX.utils.sheet_to_txt(workbook.Sheets[sheet]) + "\n"; });
                    return text;
                }
            } catch (e) { return `Error: ${e.message}`; }
            return "";
        };

        // --- APP ---
        const App = () => {
            const [apiKey, setApiKey] = usePersistentState('bg_ag_api_key', '');
            const [gScriptUrl, setGScriptUrl] = usePersistentState('bg_ag_gs_url', '');
            const [aiModel, setAiModel] = usePersistentState('bg_ag_model', DEFAULT_AI_MODELS[0]);

            const [agents, setAgents] = usePersistentState('bg_ag_agents', [{id: 1, nombre: 'Analista Senior', instrucciones: 'Eres un analista experto.'}]);

                const body = { contents: [{ parts: [{ text: prompt }] }] };

                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text;
            };

            const testConnection = async () => {
                if(!apiKey) return alert("Introduce una clave.");
                setTestStatus('loading');
                try { await callGemini("Hola", aiModel); setTestStatus('success'); }
                catch(e) { setTestStatus('error'); alert(e.message); }
            };

            const procesar = async () => {
                if(!apiKey) return setActiveTab('settings');
                setLoading(true); setResultado('');
                try {
                    setStatusMsg("Procesando documentos...");
                    let contextDoc = "";
                    for(const f of archivos) contextDoc += `\n- ARCHIVO: ${f.name}\n${await extractText(f)}\n`;

                    setStatusMsg("Orquestador decidiendo ruta...");
                    const routerPrompt = `Analiza: "${peticion}". Agentes: ${JSON.stringify(agents.map(a=>a.nombre))}. Plantillas: ${JSON.stringify(templates.map(t=>t.nombre))}. Responde JSON: {"agente":"nombre","plantilla":"nombre","internet":boolean,"busqueda":"query"}`;
                    const routerRes = await callGemini(routerPrompt, aiModel);
                    const decision = JSON.parse(routerRes.match(/\{[\s\S]*\}/)[0]);

                    let internet = "";
                    if(decision.internet){
                        setStatusMsg("Buscando en la red...");
                        internet = await callGemini(`Información sobre: ${decision.busqueda}`, aiModel, true);
                    }

                    setStatusMsg(`Agente ${decision.agente} trabajando...`);
                    const ag = agents.find(a=>a.nombre===decision.agente) || agents[0];
                    const tp = templates.find(t=>t.nombre===decision.plantilla) || templates[0];
                    const finalRes = await callGemini(`ROL: ${ag.instrucciones}\nPLANTILLA: ${tp.descripcion}\nESTILO: ${tp.ejemplo}\nDOCUMENTOS: ${contextDoc}\nINTERNET: ${internet}\nPETICION: ${peticion}`, aiModel);
                    setResultado(finalRes);
                } catch(e) { alert(e.message); } finally { setLoading(false); setStatusMsg(''); }
            };

            // --- DRIVE SYNC (IDÉNTICO A BOLSA) ---
            const syncData = async (mode = 'upload') => {
                const url = simpleDecrypt(gScriptUrl);

                setSyncStatus('syncing');

                    if (mode === 'upload') {
                        const payload = { timestamp: Date.now(), agents, templates, apiKey, aiModel, availableModels, appPin, _s_st };
                        await fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                        setLocalTimestamp(Date.now()); setSyncStatus('synced');
                    } else {
                        const resp = await fetch(url);

                            if(d.agents) setAgents(d.agents); if(d.templates) setTemplates(d.templates);

                        <nav className="flex bg-slate-800 rounded-lg p-1 gap-1 border border-slate-700">
                            <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-md text-[10px] font-bold uppercase flex items-center gap-2 ${activeTab === 'dashboard' ? 'bg-blue-600' : 'text-slate-400'}`}><Icons.Brain/> Dashboard</button>
                            <button onClick={() => setActiveTab('agentes')} className={`px-4 py-2 rounded-md text-[10px] font-bold uppercase flex items-center gap-2 ${activeTab === 'agentes' ? 'bg-blue-600' : 'text-slate-400'}`}><Icons.User/> Agentes</button>
                            <button onClick={() => setActiveTab('plantillas')} className={`px-4 py-2 rounded-md text-[10px] font-bold uppercase flex items-center gap-2 ${activeTab === 'plantillas' ? 'bg-blue-600' : 'text-slate-400'}`}><Icons.File/></button>
                            <button onClick={() => setActiveTab('settings')} className={`px-4 py-2 rounded-md text-[10px] font-bold uppercase flex items-center gap-2 ${activeTab === 'settings' ? 'bg-blue-600' : 'text-slate-400'}`}><Icons.Settings/></button>
                        </nav>
                    </header>

                    <main className="flex-1 overflow-y-auto custom-scrollbar p-6">
                        {loading && (
                            <div className="fixed inset-0 z-[200] bg-black/80 flex flex-col items-center justify-center">
                                <Icons.Loader size={50} className="text-blue-500 mb-4"/>
                                <div className="text-xl font-bold text-white mb-2">{statusMsg}</div>

                        {activeTab === 'dashboard' && (
                            <div className="max-w-4xl mx-auto space-y-6 fade-in">

                                        <select value={aiModel} onChange={e => setAiModel(e.target.value)} className="text-[10px] font-bold">
                                            {availableModels.map(m => <option key={m} value={m}>{m}</option>)}
                                        </select>
                                    </div>
                                    <textarea value={peticion} onChange={e => setPeticion(e.target.value)} placeholder="¿Qué necesitas procesar hoy?" className="w-full h-40 bg-slate-950 border border-slate-700 rounded-2xl p-5" />
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <label className="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 rounded-2xl p-6 cursor-pointer">

                        {activeTab === 'agentes' && (

                                        <input value={ag.nombre} onChange={e => { const n = [...agents]; n[i].nombre = e.target.value; setAgents(n); }} className="w-full text-blue-400 font-bold" />
                                        <textarea value={ag.instrucciones} onChange={e => { const n = [...agents]; n[i].instrucciones = e.target.value; setAgents(n); }} className="w-full h-32 text-xs" />
                                        <button onClick={()=>setAgents(agents.filter(x=>x.id!==ag.id))} className="text-red-500 text-[10px] uppercase font-bold flex items-center gap-1"><Icons.Trash/> Eliminar</button>
                                    </div>
                                ))}</div>
                            </div>
                        )}

                        {activeTab === 'plantillas' && (
                            <div className="max-w-5xl mx-auto space-y-6 fade-in">
                                <div className="flex justify-between"><h2 className="text-xl font-bold">Plantillas</h2><button onClick={()=>setTemplates([...templates, {id:Date.now(), nombre:'Nueva', descripcion:'', ejemplo:''}])} className="bg-purple-600 px-4 py-2 rounded-xl text-xs font-bold">+ Nueva</button></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">{templates.map((t, i) => (
                                    <div key={t.id} className="glass-panel p-6 rounded-2xl space-y-4">
                                        <input value={t.nombre} onChange={e => { const n = [...templates]; n[i].nombre = e.target.value; setTemplates(n); }} className="w-full text-purple-400 font-bold" />
                                        <textarea value={t.descripcion} onChange={e => { const n = [...templates]; n[i].descripcion = e.target.value; setTemplates(n); }} className="w-full h-24 text-xs" />
                                        <div className="p-3 bg-black/30 rounded-xl"><label className="text-[9px] font-bold text-slate-500 uppercase block mb-1">Entrenar estilo con archivo</label>
                                        <input type="file" onChange={async e => { const text = await extractText(e.target.files[0]); const n = [...templates]; n[i].ejemplo = text.substring(0,8000); setTemplates(n); alert("Aprendido."); }} className="text-[10px] w-full" /></div>
                                        <button onClick={()=>setTemplates(templates.filter(x=>x.id!==t.id))} className="text-red-500 text-[10px] uppercase font-bold"><Icons.Trash/> Eliminar</button>
                                    </div>
                                ))}</div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="max-w-2xl mx-auto space-y-8 fade-in pb-10">
                                {/* CONFIG IA (BOLSA STYLE) */}
                                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                                    <div className="flex items-center gap-4 mb-6 border-b border-slate-700 pb-4"><div className="p-3 bg-purple-500/20 rounded-xl text-purple-400"><Icons.Brain size={32} /></div><div><h2 className="text-2xl font-bold text-white">Configuración IA</h2><p className="text-slate-400 text-sm">Conexión con Google Gemini</p></div></div>
                                    <label className="block text-sm font-bold text-slate-300 mb-2">Google Gemini API Key</label>
                                    <div className="relative mb-4"><input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="AIzaSy..." className="w-full bg-black/50 border border-slate-600 rounded-xl p-4 font-mono"/><button className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500"><Icons.Eye/></button></div>
                                    <div className="flex justify-end mb-6"><button onClick={testConnection} className={`px-6 py-2 rounded-xl border font-bold text-xs flex items-center gap-2 ${testStatus==='success'?'bg-green-600':'bg-slate-700'}`}>{testStatus==='loading'?<Icons.Loader/>:'PROBAR CONEXIÓN'}</button></div>
                                    
                                    <label className="block text-sm font-bold text-slate-300 mb-2 uppercase">Modelo IA Activo</label>
                                    <select value={aiModel} onChange={e => setAiModel(e.target.value)} className="w-full bg-slate-800 border border-slate-600 rounded-xl p-3 mb-6">
                                        {availableModels.map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>

                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-6">
                                        <label className="block text-[10px] font-bold text-slate-500 mb-2 uppercase">Añadir Nuevo ID de Modelo</label>
                                        <div className="flex gap-2">
                                            <input type="text" id="newMod" placeholder="Ej: gemini-2.5-pro" className="flex-1 text-xs" />
                                            <button onClick={()=>{const i=document.getElementById('newMod'); if(i.value){setAvailableModels([...availableModels, i.value]); setAiModel(i.value); i.value='';}}} className="bg-blue-600 px-4 py-2 rounded-lg text-xs font-bold uppercase">Añadir</button>
                                        </div>
                                    </div>

                                    {/* TUTORIAL API (BOLSA STYLE) */}
                                    <div className="p-6 bg-[#1e293b] border border-[#334155] rounded-xl"><h4 className="text-lg font-bold text-blue-400 mb-4 flex items-center gap-2"><Icons.Brain size={20} /> Gestión de la API Key</h4>
                                        <div className="mb-6 border-b border-slate-700 pb-6"><h5 className="text-sm font-bold text-white mb-3">Opción Gratuita</h5><ol className="list-decimal list-inside text-xs text-slate-300 space-y-2 mb-4"><li>Accede a <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-blue-400 font-bold underline">Google AI Studio</a>.</li><li>Pulsa en <strong>"Get API key"</strong> y luego en <strong>"Create API Key"</strong>.</li><li>Copia la clave y pégala arriba.</li></ol></div>
                                        <h5 className="text-sm font-bold text-white mb-3">Opción de Pago (Ilimitada)</h5><p className="text-xs text-slate-300 mb-3">Para evitar bloqueos, asocia una tarjeta en la misma web de AI Studio pulsando en el menú de "Billing". El coste es por uso y es ínfimo (céntimos al mes).</p>
                                    </div>
                                </div>

                                {/* SYNC CLOUD (BOLSA STYLE) */}
                                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                                    <h4 className="text-sm font-bold text-blue-400 mb-4 uppercase tracking-widest flex items-center gap-2"><Icons.Globe size={16}/>Copia Automática en GDRIVE</h4>
                                    <div className="flex items-end gap-2 mb-4"><input type="password" value={simpleDecrypt(gScriptUrl)} onChange={e=>setGScriptUrl(simpleEncrypt(e.target.value))} placeholder="https://script.google.com/..." className="w-full bg-black/50 border border-slate-600 rounded-xl p-3 font-mono text-xs"/><button onClick={uploadToCloud} className="bg-blue-600 p-3 rounded-xl"><Icons.Refresh/></button></div>
                                    
                                    <div className="bg-slate-950/50 border border-slate-700 rounded-xl p-4">
                                        <h5 className="text-xs font-bold text-white mb-3">Guía de Configuración (Script de Google)</h5>
                                        <ol className="list-decimal list-inside text-[11px] text-slate-300 space-y-2">
                                            <li>Ve a <a href="https://script.google.com/home" target="_blank" className="text-blue-400 font-bold">Google Apps Script</a> y pulsa en <strong>"Nuevo Proyecto"</strong>.</li>
                                            <li>Borra el código y pega este bloque exacto:
                                                <pre className="bg-black text-green-500 p-2 rounded mt-2 border border-slate-800 overflow-x-auto text-[10px] font-mono select-all">
{`function A_AUTORIZAR_AQUI() {
  DriveApp.getFiles(); 
  UrlFetchApp.fetch("https://www.google.com");
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  lock.tryLock(10000);
  try {
    var data = JSON.parse(e.postData.contents);
    var files = DriveApp.getFilesByName("BOARDINGGATE_AGENTS_DB.json");
    var file = files.hasNext() ? files.next() : DriveApp.createFile("BOARDINGGATE_AGENTS_DB.json", "{}", MimeType.PLAIN_TEXT);
    file.setContent(JSON.stringify(data));
    return ContentService.createTextOutput("OK");
  } catch(err) { return ContentService.createTextOutput(err.toString()); } 
  finally { lock.releaseLock(); }
}

function doGet(e) {
  var files = DriveApp.getFilesByName("BOARDINGGATE_AGENTS_DB.json");
  if (files.hasNext()) return ContentService.createTextOutput(files.next().getBlob().getDataAsString()).setMimeType(ContentService.MimeType.JSON);
  return ContentService.createTextOutput(JSON.stringify({timestamp:0})).setMimeType(ContentService.MimeType.JSON);
}`}
                                                </pre>
                                            </li>
                                            <li className="text-blue-400 font-bold">Selecciona "doPost" y pulsa ▶ Ejecutar para autorizar a Drive.</li>
                                            <li>Pulsa en <strong>"Implementar"</strong> &rarr; <strong>"Nueva implementación"</strong> &rarr; <strong>"Aplicación web"</strong>.</li>
                                            <li>En "Quién tiene acceso", elige <strong>"Cualquier usuario"</strong>.</li>
                                        </ol>
                                    </div>
                                </div>

                                {/* BACKUP Y SEGURIDAD */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                                        <h3 className="text-sm font-bold mb-4 text-red-400">Seguridad PIN</h3>
                                        <input type="password" value={appPin} onChange={e=>setAppPin(e.target.value.replace(/\D/g,'').slice(0,4))} placeholder="PIN 4 dígitos" className="w-full bg-black/50 text-center text-2xl tracking-[1em]" />
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex flex-col gap-2">
                                        <h3 className="text-sm font-bold mb-2">Copia Local</h3>
                                        <button onClick={handleExport} className="w-full bg-slate-800 py-2 rounded text-[10px] font-bold">EXPORTAR JSON</button>
                                        <label className="w-full bg-blue-600 py-2 rounded text-[10px] font-bold text-center cursor-pointer">IMPORTAR JSON<input type="file" className="hidden" onChange={handleImport} /></label>
                                    </div>
                                </div>

                                {/* ESTADO HASH */}
                                <div className="bg-slate-900 p-8 rounded-2xl border-l-4 border-l-green-500 shadow-2xl">
                                    <h2 className="text-xl font-bold mb-4">Hash de Instalación</h2>
                                    <div className="flex gap-2">
                                        <input type="text" id="licInput" placeholder="XXXX-XXXX" className="flex-1 bg-black p-3 font-mono" />
                                        <button onClick={()=>{const v=document.getElementById('licInput').value; if(_0x8f(v)){_s_set(_0xT); alert("OK");}else{alert("ERR");}}} className="bg-blue-600 px-6 font-bold text-xs uppercase">Validar</button>
                                    </div>
                                    {_0xAuth && <div className="mt-4 text-green-400 text-xs font-black tracking-[0.2em] animate-pulse">● SISTEMA ACTIVADO</div>}
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="shrink-0 bg-slate-900 border-t border-slate-800 py-1 px-6 flex justify-between items-center text-[8px] text-slate-600 font-bold uppercase">
                        <div>BoardingGate Agents v1.1 (Secure)</div>
                        <div className="flex gap-4">
                            <span>Sinc Nube: {syncStatus==='synced'?'OK':'NO CONFIG'}</span>
                            <span>Licencia: {_0xAuth?'ACTIVA':'RESTRINGIDA'}</span>
                        </div>
                    </footer>
                </div>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
