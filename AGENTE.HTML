<!DOCTYPE html>
<html lang="es"> 
<head> 
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoardingGate - Multi Agente iA</title>
    
    <!-- Librerías de Estilo y UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Core React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Librerías de Procesamiento de Documentos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { background-color: #0a0a0a; font-family: 'Inter', sans-serif; color: #e5e5e5; }
        .glass-panel { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .active-tab { background-color: #3b82f6; color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        input, select, textarea { background: #1e293b; border: 1px solid #334155; color: white; border-radius: 8px; padding: 10px; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { createRoot } = ReactDOM;

        // --- CONSTANTES Y UTILIDADES ---
        const DEFAULT_AI_MODELS = [
            "gemini-2.0-flash-exp",
            "gemini-1.5-pro-latest",
            "gemini-1.5-flash-latest",
            "gemini-3.1-pro-preview",
            "gemini-3-pro-preview",
            "gemini-3-flash-preview"
        ];

        const Icons = {
            Brain: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
            Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
            FileText: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>,
            Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
            Upload: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>,
            Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>,
            Loader: () => <svg className="w-6 h-6 animate-spin" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        };

        const usePersistentState = (key, initialValue) => {
            const [state, setState] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch { return initialValue; }
            });
            useEffect(() => { window.localStorage.setItem(key, JSON.stringify(state)); }, [key, state]);
            return [state, setState];
        };

        const simpleEncrypt = (text) => btoa(text);
        const simpleDecrypt = (text) => { try { return atob(text); } catch { return ""; } };

        // --- FUNCIONES DE EXTRACCIÓN DE DOCUMENTOS ---
        const extractText = async (file) => {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'pdf') {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let text = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(item => item.str).join(' ') + "\n";
                }
                return text;
            } else if (ext === 'docx') {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer });
                return result.value;
            } else if (ext === 'xlsx' || ext === 'xls') {
                const arrayBuffer = await file.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer);
                let text = "";
                workbook.SheetNames.forEach(sheet => {
                    text += XLSX.utils.sheet_to_txt(workbook.Sheets[sheet]) + "\n";
                });
                return text;
            }
            return "";
        };

        // --- COMPONENTE: MODAL ---
        const Modal = ({ isOpen, title, onClose, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-slate-900 border border-slate-700 w-full max-w-2xl rounded-2xl flex flex-col max-h-[90vh] shadow-2xl overflow-hidden">
                        <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                            <h3 className="text-lg font-bold text-white">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
                        </div>
                        <div className="p-6 overflow-y-auto custom-scrollbar">{children}</div>
                    </div>
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [apiKey, setApiKey] = usePersistentState('bg_agents_api_key', '');
            const [gScriptUrl, setGScriptUrl] = usePersistentState('bg_agents_gscript', '');
            const [aiModel, setAiModel] = usePersistentState('bg_agents_model', 'gemini-2.0-flash-exp');
            const [availableModels, setAvailableModels] = usePersistentState('bg_agents_models_list', DEFAULT_AI_MODELS);
            
            const [agents, setAgents] = usePersistentState('bg_agents_list', [{id: 1, nombre: 'Asistente General', instrucciones: 'Eres un asistente experto.'}]);
            const [templates, setTemplates] = usePersistentState('bg_templates_list', [{id: 1, nombre: 'Texto Libre', descripcion: 'Formato estándar.'}]);
            
            const [peticion, setPeticion] = useState('');
            const [archivos, setArchivos] = useState([]);
            const [resultado, setResultado] = useState('');
            const [loading, setLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState('');

            // --- LÓGICA IA ---
            const callGemini = async (prompt, tools = false) => {
                const body = {
                    contents: [{ parts: [{ text: prompt }] }]
                };
                if (tools) {
                    body.tools = [{ google_search: {} }];
                }

                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${aiModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text;
            };

            const procesarPeticion = async () => {
                if (!apiKey) return alert("Configura la API Key en Ajustes.");
                setLoading(true);
                setResultado('');
                try {
                    // 1. Extraer texto de archivos
                    setStatusMsg("Extrayendo contenido de documentos...");
                    let contextFiles = "";
                    for (const f of archivos) {
                        const t = await extractText(f);
                        contextFiles += `\n--- ARCHIVO: ${f.name} ---\n${t}\n`;
                    }

                    // 2. Orquestador: Decidir Agente, Plantilla e Internet
                    setStatusMsg("Orquestador analizando ruta óptima...");
                    const routerPrompt = `
                        Analiza esta petición: "${peticion}"
                        Agentes disponibles: ${JSON.stringify(agents.map(a => a.nombre))}
                        Plantillas disponibles: ${JSON.stringify(templates.map(t => t.nombre))}
                        
                        Responde estrictamente en formato JSON:
                        {
                            "agente": "Nombre del agente elegido",
                            "plantilla": "Nombre de la plantilla elegida",
                            "necesitaInternet": true/false,
                            "busquedaInternet": "términos de búsqueda si necesita"
                        }
                    `;
                    const routerRes = await callGemini(routerPrompt);
                    const decision = JSON.parse(routerRes.match(/\{[\s\S]*\}/)[0]);

                    let contextInternet = "";
                    if (decision.necesitaInternet) {
                        setStatusMsg("Agente de Búsqueda consultando internet...");
                        contextInternet = await callGemini(`Briefing sobre: ${decision.busquedaInternet}`, true);
                    }

                    // 3. Ejecución Final con el Agente Especialista
                    setStatusMsg(`Agente [${decision.agente}] generando respuesta final...`);
                    const agenteObj = agents.find(a => a.nombre === decision.agente) || agents[0];
                    const templateObj = templates.find(t => t.nombre === decision.plantilla) || templates[0];

                    const finalPrompt = `
                        ROL: ${agenteObj.instrucciones}
                        PLANTILLA DE SALIDA: ${templateObj.descripcion} ${templateObj.ejemplo ? `(Estructura base: ${templateObj.ejemplo})` : ''}
                        
                        CONTEXTO DOCUMENTOS: ${contextFiles}
                        CONTEXTO INTERNET: ${contextInternet}
                        
                        PETICIÓN DEL USUARIO: ${peticion}
                        
                        Genera el resultado final con estilo profesional y refinado:
                    `;
                    
                    const finalRes = await callGemini(finalPrompt);
                    setResultado(finalRes);

                } catch (e) {
                    alert("Error: " + e.message);
                } finally {
                    setLoading(false);
                    setStatusMsg('');
                }
            };

            // --- SINCRONIZACIÓN ---
            const syncData = async (mode = 'upload') => {
                const url = simpleDecrypt(gScriptUrl);
                if (!url) return;
                try {
                    if (mode === 'upload') {
                        const payload = { timestamp: Date.now(), agents, templates, apiKey, aiModel, availableModels };
                        await fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                    } else {
                        const resp = await fetch(url);
                        const data = await resp.json();
                        if (data.timestamp > 0) {
                            if (data.agents) setAgents(data.agents);
                            if (data.templates) setTemplates(data.templates);
                            if (data.apiKey) setApiKey(data.apiKey);
                        }
                    }
                } catch (e) { console.error("Error Sync:", e); }
            };

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    {/* Header */}
                    <header className="px-6 py-4 glass-panel border-b border-white/10 flex justify-between items-center shrink-0">
                        <div>
                            <h1 className="text-2xl font-bold tracking-tighter text-white font-['Orbitron']">
                                Boarding<span className="text-blue-500">Gate</span> <span className="text-xs text-slate-500 font-sans">Multi Agente iA</span>
                            </h1>
                        </div>
                        <nav className="flex gap-2 bg-black/40 p-1 rounded-xl border border-white/5">
                            <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 ${activeTab === 'dashboard' ? 'active-tab' : 'text-slate-400 hover:text-white'}`}><Icons.Brain/> Dashboard</button>
                            <button onClick={() => setActiveTab('agentes')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 ${activeTab === 'agentes' ? 'active-tab' : 'text-slate-400 hover:text-white'}`}><Icons.Users/> Agentes</button>
                            <button onClick={() => setActiveTab('plantillas')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 ${activeTab === 'plantillas' ? 'active-tab' : 'text-slate-400 hover:text-white'}`}><Icons.FileText/> Plantillas</button>
                            <button onClick={() => setActiveTab('ajustes')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 ${activeTab === 'ajustes' ? 'active-tab' : 'text-slate-400 hover:text-white'}`}><Icons.Settings/> Ajustes</button>
                        </nav>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto custom-scrollbar p-6 relative">
                        {loading && (
                            <div className="absolute inset-0 z-[200] bg-black/60 backdrop-blur-md flex flex-col items-center justify-center fade-in">
                                <div className="text-blue-500 mb-4"><Icons.Loader/></div>
                                <div className="text-xl font-bold text-white mb-2">{statusMsg}</div>
                                <div className="text-xs text-slate-400 animate-pulse">Este proceso puede tomar unos segundos...</div>
                            </div>
                        )}

                        {activeTab === 'dashboard' && (
                            <div className="max-w-4xl mx-auto space-y-6 fade-in">
                                <div className="glass-panel p-6 rounded-3xl space-y-4">
                                    <div className="flex justify-between items-end">
                                        <label className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Motor de IA Activo</label>
                                        <select value={aiModel} onChange={e => setAiModel(e.target.value)} className="text-[10px] font-bold py-1 px-3">
                                            {availableModels.map(m => <option key={m} value={m}>{m}</option>)}
                                        </select>
                                    </div>
                                    <textarea 
                                        value={peticion}
                                        onChange={e => setPeticion(e.target.value)}
                                        placeholder="Describe tu petición aquí... (Ej: Analiza estas facturas y hazme un informe comparativo con los precios de mercado)"
                                        className="w-full h-32 bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm focus:border-blue-500 outline-none transition-all"
                                    />
                                    <div className="flex items-center gap-4">
                                        <label className="flex-1 cursor-pointer bg-slate-800/40 border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-2xl p-4 transition-all text-center">
                                            <input type="file" multiple onChange={e => setArchivos([...archivos, ...Array.from(e.target.files)])} className="hidden" />
                                            <div className="flex flex-col items-center gap-2">
                                                <Icons.Upload/>
                                                <span className="text-[10px] font-bold uppercase text-slate-400">Subir Documentos (PDF, DOCX, XLSX)</span>
                                            </div>
                                        </label>
                                        <button onClick={procesarPeticion} className="bg-blue-600 hover:bg-blue-500 text-white px-10 py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg shadow-blue-900/20 transition-all active:scale-95">
                                            Procesar
                                        </button>
                                    </div>
                                    {archivos.length > 0 && (
                                        <div className="flex flex-wrap gap-2 pt-2">
                                            {archivos.map((f, i) => (
                                                <div key={i} className="bg-blue-500/10 text-blue-400 text-[10px] px-3 py-1 rounded-full border border-blue-500/20 flex items-center gap-2">
                                                    {f.name} <button onClick={() => setArchivos(archivos.filter((_, idx) => idx !== i))}>✕</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {resultado && (
                                    <div className="glass-panel p-8 rounded-3xl fade-in bg-white/5 border-blue-500/20">
                                        <div className="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                                            <h3 className="text-blue-400 font-bold text-xs uppercase tracking-widest flex items-center gap-2"><Icons.FileText/> Resultado del Análisis</h3>
                                            <button onClick={() => navigator.clipboard.writeText(resultado)} className="text-[10px] font-bold bg-slate-800 px-3 py-1 rounded-lg hover:bg-slate-700">Copiar</button>
                                        </div>
                                        <div className="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap font-sans">
                                            {resultado}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'agentes' && (
                            <div className="max-w-4xl mx-auto space-y-4 fade-in">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold">Mis Agentes Expertos</h2>
                                    <button onClick={() => setAgents([...agents, {id: Date.now(), nombre: 'Nuevo Agente', instrucciones: ''}])} className="bg-blue-600 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2"><Icons.Plus/> Nuevo</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {agents.map((agent, i) => (
                                        <div key={agent.id} className="glass-panel p-5 rounded-2xl border border-white/5 space-y-3">
                                            <input value={agent.nombre} onChange={e => {
                                                const n = [...agents]; n[i].nombre = e.target.value; setAgents(n);
                                            }} className="w-full font-bold text-blue-400 text-sm" placeholder="Nombre del Agente" />
                                            <textarea value={agent.instrucciones} onChange={e => {
                                                const n = [...agents]; n[i].instrucciones = e.target.value; setAgents(n);
                                            }} className="w-full h-32 text-xs" placeholder="Instrucciones del rol (System Prompt)..." />
                                            <button onClick={() => setAgents(agents.filter(a => a.id !== agent.id))} className="text-red-500 text-[10px] uppercase font-bold flex items-center gap-1 hover:text-red-400"><Icons.Trash/> Eliminar</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'plantillas' && (
                            <div className="max-w-4xl mx-auto space-y-4 fade-in">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold">Modelos de Salida</h2>
                                    <button onClick={() => setTemplates([...templates, {id: Date.now(), nombre: 'Nueva Plantilla', descripcion: '', ejemplo: ''}])} className="bg-blue-600 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2"><Icons.Plus/> Nueva</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {templates.map((temp, i) => (
                                        <div key={temp.id} className="glass-panel p-5 rounded-2xl space-y-3">
                                            <input value={temp.nombre} onChange={e => {
                                                const n = [...templates]; n[i].nombre = e.target.value; setTemplates(n);
                                            }} className="w-full font-bold text-purple-400 text-sm" placeholder="Nombre del Modelo" />
                                            <textarea value={temp.descripcion} onChange={e => {
                                                const n = [...templates]; n[i].descripcion = e.target.value; setTemplates(n);
                                            }} className="w-full h-24 text-xs" placeholder="Describe la estructura o reglas del formato..." />
                                            <div className="space-y-1">
                                                <label className="text-[10px] text-slate-500 uppercase font-bold">Ejemplo extraído de archivo</label>
                                                <div className="flex gap-2">
                                                    <input type="file" onChange={async e => {
                                                        const text = await extractText(e.target.files[0]);
                                                        const n = [...templates]; n[i].ejemplo = text.substring(0, 5000); setTemplates(n);
                                                    }} className="text-[10px] w-full" />
                                                </div>
                                            </div>
                                            <button onClick={() => setTemplates(templates.filter(t => t.id !== temp.id))} className="text-red-500 text-[10px] uppercase font-bold"><Icons.Trash/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'ajustes' && (
                            <div className="max-w-3xl mx-auto space-y-8 fade-in pb-10">
                                {/* API KEY SECTION */}
                                <div className="glass-panel p-8 rounded-3xl space-y-6">
                                    <h2 className="text-xl font-bold flex items-center gap-3"><Icons.Settings/> Configuración Global</h2>
                                    
                                    <div>
                                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Google Gemini API Key</label>
                                        <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="AIzaSy..." className="w-full font-mono text-xs" />
                                    </div>

                                    <div className="p-4 bg-blue-900/20 border border-blue-500/30 rounded-2xl space-y-3">
                                        <h4 className="text-xs font-bold text-blue-400">Manual: Obtención de API KEY</h4>
                                        <p className="text-[11px] text-slate-300"><b>Opción Gratis:</b> Ve a <a href="https://aistudio.google.com/" className="text-blue-500 underline" target="_blank">Google AI Studio</a>, pulsa en "Get API Key" y crea una. Tienes 15 consultas/minuto gratis.</p>
                                        <p className="text-[11px] text-slate-300"><b>Opción Ilimitada:</b> En la misma web, asocia una tarjeta de crédito en Billing. El coste es despreciable (unos céntimos por millones de palabras).</p>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Gestión de Modelos</label>
                                        <div className="flex gap-2">
                                            <input type="text" id="newMod" placeholder="ID del modelo (ej: gemini-2.0-flash)" className="flex-1 text-xs" />
                                            <button onClick={() => {
                                                const v = document.getElementById('newMod').value;
                                                if(v) setAvailableModels([...availableModels, v]);
                                            }} className="bg-slate-700 px-4 rounded-lg text-xs font-bold">Añadir</button>
                                        </div>
                                    </div>
                                </div>

                                {/* GDRIVE SECTION */}
                                <div className="glass-panel p-8 rounded-3xl space-y-6">
                                    <h2 className="text-xl font-bold flex items-center gap-3">☁️ Sincronización Nube (GDrive)</h2>
                                    <div>
                                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">URL del Google Apps Script</label>
                                        <input type="password" value={simpleDecrypt(gScriptUrl)} onChange={e => setGScriptUrl(simpleEncrypt(e.target.value))} placeholder="https://script.google.com/..." className="w-full font-mono text-xs" />
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => syncData('upload')} className="flex-1 bg-blue-600 py-3 rounded-xl font-bold uppercase text-[10px]">Guardar en Drive Ahora</button>
                                        <button onClick={() => syncData('download')} className="flex-1 bg-slate-700 py-3 rounded-xl font-bold uppercase text-[10px]">Descargar de Drive</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer Status */}
                    <footer className="shrink-0 glass-panel border-t border-white/5 py-1 px-6 flex justify-between items-center text-[8px] text-slate-600 font-bold uppercase tracking-widest">
                        <div>BoardingGate Agent v1.0 (SECURE)</div>
                        <div className="flex gap-4">
                            <span>Sincronización: {gScriptUrl ? 'CONFIGURADA' : 'SÓLO LOCAL'}</span>
                        </div>
                    </footer>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
