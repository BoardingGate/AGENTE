        const Icons = {

            Users: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            FileText: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>,
            Upload: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            Trash: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Trash2: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,

            CheckCircle: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            AlertCircle: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,

            History: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            ExternalLink: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>,
            Download: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        };

        const extractTextFromFile = async (file) => {
            const ext = file.name.split('.').pop().toLowerCase();
            try {
                if (ext === 'pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let text = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(item => item.str).join(' ') + "\n";
                    }
                    return text;
                } else if (ext === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const res = await mammoth.extractRawText({ arrayBuffer });
                    return res.value;
                } else if (ext === 'xlsx' || ext === 'xls') {
                    const wb = XLSX.read(await file.arrayBuffer());
                    let text = "";
                    wb.SheetNames.forEach(s => text += XLSX.utils.sheet_to_txt(wb.Sheets[s]) + "\n");
                    return text;
                }
            } catch (e) { return `[Error procesando ${file.name}]`; }
            return "";
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            const [apiKey, setApiKey] = usePersistentState('bg_ag_api_key', '');
            const [gScriptUrl, setGScriptUrl] = usePersistentState('bg_ag_gs_url', '');
            const [aiModel, setAiModel] = usePersistentState('bg_ag_ai_model', DEFAULT_AI_MODELS[0]);
            const [availableModels, setAvailableModels] = usePersistentState('bg_ag_models_list', DEFAULT_AI_MODELS);
            const [appPin, setAppPin] = usePersistentState('bg_ag_pin', '');
            const [_s_st, _s_set] = usePersistentState(_0xL, '');
            const [localTimestamp, setLocalTimestamp] = usePersistentState('bg_ag_ts', Date.now());
            
            const [agents, setAgents] = usePersistentState('bg_ag_agents_data', [{id: 1, nombre: 'Analista Senior', instrucciones: 'Eres un analista experto en datos reales.'}]);
            const [templates, setTemplates] = usePersistentState('bg_ag_temps_data', [{id: 1, nombre: 'Informe Ejecutivo', descripcion: 'Estructura profesional con tablas y conclusiones.'}]);
            const [history, setHistory] = usePersistentState('bg_ag_history', []);
            
            const [isAppReady, setIsAppReady] = useState(false);
            const [isPinLocked, setIsPinLocked] = useState(!!appPin);
            const [enteredPin, setEnteredPin] = useState('');
            const [loading, setLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState('');
            const [testStatus, setTestStatus] = useState(null);
            const [syncStatus, setSyncStatus] = useState('idle');
            const [showKey, setShowKey] = useState(false);
            const [showUrl, setShowUrl] = useState(false);
            
            const [peticion, setPeticion] = useState('');
            const [archivos, setArchivos] = useState([]);
            const [resultado, setResultado] = useState('');
            const [infoOrquestador, setInfoOrquestador] = useState(null);

            const _0xAuth = useMemo(() => _s_st === _0xT, [_s_st]);

            const callGemini = async (prompt, model, useSearch = false) => {
                const body = { contents: [{ parts: [{ text: prompt }] }] };
                if (useSearch) body.tools = [{ google_search: {} }];
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text;
            };

            const uploadToCloud = useCallback(async (isAuto = false) => {
                const url = simpleDecrypt(gScriptUrl);
                if (!url) return;
                setSyncStatus('syncing');
                try {
                    const now = Date.now();
                    const payload = { timestamp: now, agents, templates, history, apiKey, aiModel, availableModels, appPin, _s_st };
                    await fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                    setLocalTimestamp(now);
                    setSyncStatus('synced');
                } catch (e) { setSyncStatus('error'); }
            }, [agents, templates, history, apiKey, aiModel, availableModels, appPin, _s_st, gScriptUrl]);

            const downloadFromCloud = async () => {
                const url = simpleDecrypt(gScriptUrl);
                if (!url) { setIsAppReady(true); return; }
                try {
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.timestamp > localTimestamp) {
                        if(data.agents) setAgents(data.agents); if(data.templates) setTemplates(data.templates);
                        if(data.history) setHistory(data.history); if(data.apiKey) setApiKey(data.apiKey);
                        setLocalTimestamp(data.timestamp);
                    }
                    setSyncStatus('synced');
                } catch (e) { setSyncStatus('error'); } finally { setIsAppReady(true); }
            };

            const testConnection = async () => {
                if(!apiKey) return alert("Introduce una clave.");
                setTestStatus('loading');
                try {
                    await callGemini("Responde OK", aiModel);
                    setTestStatus('success');
                    setTimeout(() => setTestStatus(null), 3000);
                } catch(e) { setTestStatus('error'); alert(e.message); }
            };

            const procesarMision = async () => {
                if(!apiKey) return setActiveTab('settings');
                if(!peticion.trim()) return;
                setLoading(true); setResultado('');
                try {
                    setStatusMsg("Analizando Archivos Adjuntos...");
                    let contextDoc = "";
                    for(const f of archivos) contextDoc += `\n- DOCUMENTO [${f.name}]:\n${await extractTextFromFile(f)}\n`;
                    
                    setStatusMsg("Orquestador: Seleccionando Especialista y Plantilla...");
                    const routerPrompt = `Analiza la misión: "${peticion}". 
                    Agentes: ${JSON.stringify(agents.map(a=>a.nombre))}. 
                    Plantillas: ${JSON.stringify(templates.map(t=>t.nombre))}. 
                    Responde SOLO con este JSON: {"agente":"nombre","plantilla":"nombre","buscar_internet":boolean,"query":"texto para buscar"}`;
                    
                    const routerRes = await callGemini(routerPrompt, aiModel);
                    const decision = JSON.parse(routerRes.match(/\{[\s\S]*\}/)[0]);
                    
                    let internetInfo = "";
                    if(decision.buscar_internet) {
                        setStatusMsg(`Orquestador: Consultando fuentes en tiempo real sobre "${decision.query}"...`);
                        internetInfo = await callGemini(`Dame datos específicos y actuales sobre: ${decision.query}`, aiModel, true);
                    }

                    const ag = agents.find(a=>a.nombre===decision.agente) || agents[0];
                    const tp = templates.find(t=>t.nombre===decision.plantilla) || templates[0];
                    setInfoOrquestador({ agentes: ag.nombre, plantilla: tp.nombre, internet: decision.buscar_internet ? 'Activado' : 'No necesario' });

                    setStatusMsg(`Agente ${ag.nombre}: Redactando informe final...`);
                    
                    const promptFinal = `
                    SISTEMA: Eres el agente ${ag.nombre}.
                    INSTRUCCIONES DE ROL: ${ag.instrucciones}.
                    FORMATO DE SALIDA: ${tp.descripcion}.
                    ESTILO REQUERIDO: ${tp.ejemplo || 'Profesional y detallado'}.
                    
                    CONTEXTO DE DOCUMENTOS SUBIDOS: ${contextDoc || 'Ninguno'}.
                    DATOS REALES DE INTERNET (ACTUALIZADOS): ${internetInfo || 'No se requirió búsqueda'}.
                    
                    REGLAS CRÍTICAS:
                    1. La información de INTERNET y DOCUMENTOS es REAL y VERÍDICA. No la ignores.
                    2. Prioriza los datos actuales sobre tus conocimientos previos.
                    3. No alucines. Si no hay datos, indica "Datos no disponibles".
                    4. Respuesta obligatoria en HTML semántico.
                    
                    MISIÓN: ${peticion}`;

                    const res = await callGemini(promptFinal, aiModel);
                    const htmlFinal = res.replace(/```html/g, '').replace(/```/g, '');
                    setResultado(htmlFinal);
                    
                    // Guardar en historial
                    const descCorta = peticion.length > 50 ? peticion.substring(0, 50) + "..." : peticion;
                    setHistory(prev => [{id: Date.now(), peticion, desc: descCorta, fecha: new Date().toLocaleString()}, ...prev].slice(0, 15));
                    
                    uploadToCloud(true);
                } catch(e) { 
                    alert("Error en el proceso: " + e.message); 
                } finally { 
                    setLoading(false); setStatusMsg(''); 
                }
            };

            const reuseHistory = (item) => {
                setPeticion(item.peticion);
                window.scrollTo({top: 0, behavior: 'smooth'});
            };

            useEffect(() => { downloadFromCloud(); }, []);

            if(isPinLocked) {
                return (
                    <div className="h-full flex flex-col items-center justify-center bg-[#0a0a0a]">
                        <div className="bg-slate-900 border border-slate-800 p-10 rounded-3xl text-center shadow-2xl">
                            <Icons.Brain size={50} className="mx-auto text-blue-600 mb-6"/>
                            <input type="password" value={enteredPin} onChange={e=>{const v=e.target.value.slice(0,4); setEnteredPin(v); if(v===appPin) setIsPinLocked(false);}} placeholder="PIN" className="w-full bg-black border border-slate-700 p-4 text-center text-3xl font-mono text-white" autoFocus />
                        </div>
                    </div>
                );
            }

            return (
                <div id="root">
                    <header className="shrink-0 bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center z-50">
                        <div><h1 className="text-2xl font-bold font-['Orbitron']">Boarding<span className="text-blue-600">Gate</span></h1><p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Multi-Agente iA</p></div>
                        <nav className="flex bg-slate-800 rounded-xl p-1 gap-1 border border-slate-700 overflow-x-auto">
                            <button onClick={()=>setActiveTab('dashboard')} className={`px-5 py-2.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 ${activeTab==='dashboard'?'active-tab':'text-slate-400'}`}><Icons.Brain/> Consola Dashboard</button>
                            <button onClick={()=>setActiveTab('agentes')} className={`px-5 py-2.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 ${activeTab==='agentes'?'active-tab':'text-slate-400'}`}><Icons.Users/> Mis Agentes</button>
                            <button onClick={()=>setActiveTab('plantillas')} className={`px-5 py-2.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 ${activeTab==='plantillas'?'active-tab':'text-slate-400'}`}><Icons.FileText/> Modelos Salida</button>
                            <button onClick={()=>setActiveTab('settings')} className={`px-5 py-2.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 ${activeTab==='settings'?'active-tab':'text-slate-400'}`}><Icons.Settings/> Ajustes</button>
                        </nav>
                    </header>

                    <main className="flex-1 overflow-y-auto custom-scrollbar p-6">
                        {loading && (
                            <div className="absolute inset-0 z-[200] bg-black/80 flex flex-col items-center justify-center">
                                <Icons.Loader size={60} className="text-blue-500 mb-6"/><div className="text-xl font-bold text-white uppercase tracking-widest animate-pulse px-6 text-center">{statusMsg}</div>
                            </div>
                        )}

                        {activeTab === 'dashboard' && (
                            <div className="max-w-4xl mx-auto space-y-6 fade-in pb-10">
                                <div className="glass-panel p-8 rounded-3xl space-y-6 shadow-2xl border-t border-white/10">
                                    <div className="flex justify-between items-center text-xs font-black uppercase text-blue-400 tracking-widest">
                                        <span>Entrada de Misión</span>
                                        <div className="flex items-center gap-2">
                                            <span className="text-[9px] text-slate-500">Motor:</span>
                                            <select value={aiModel} onChange={e=>{setAiModel(e.target.value); uploadToCloud(true);}} className="text-[10px] font-bold px-3 py-1 bg-slate-900 border-slate-700 text-white outline-none">
                                                {availableModels.map(m=><option key={m} value={m}>{m}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <textarea value={peticion} onChange={e=>setPeticion(e.target.value)} placeholder="¿Cuál es la misión de hoy?" className="w-full h-44 bg-slate-950/50 border border-slate-700 rounded-2xl p-6 text-sm focus:border-blue-500 outline-none transition-all" />
                                    
                                    <div className="flex flex-col gap-4">
                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                            <label className="md:col-span-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-700 rounded-2xl py-4 cursor-pointer hover:border-blue-500 bg-slate-800/20 transition-all">
                                                <input type="file" multiple onChange={e=>setArchivos([...archivos,...Array.from(e.target.files)])} className="hidden"/><Icons.Upload size={24}/>
                                                <span className="text-[9px] uppercase font-black text-slate-500 mt-1">Documentos</span>
                                            </label>
                                            <button onClick={procesarMision} className="md:col-span-3 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black uppercase text-sm shadow-2xl py-4 transition-all transform active:scale-[0.98]">
                                                Ejecutar Misión Estratégica
                                            </button>
                                        </div>
                                        <div className="flex flex-wrap gap-2">{archivos.map((f,i)=><div key={i} className="bg-blue-900/40 border border-blue-500/30 px-3 py-1 rounded-full text-[9px] font-bold text-blue-300 flex items-center">{f.name} <button onClick={()=>setArchivos(archivos.filter((_,x)=>x!==i))} className="ml-2">✕</button></div>)}</div>
                                    </div>
                                </div>

                                {history.length > 0 && (
                                    <div className="glass-panel p-6 rounded-3xl space-y-4">
                                        <div className="flex items-center gap-2 text-xs font-black uppercase text-slate-400 tracking-widest"><Icons.History size={14}/> Misiones Recientes</div>
                                        <div className="grid grid-cols-1 gap-2">
                                            {history.map(item => (
                                                <div key={item.id} onClick={()=>reuseHistory(item)} className="bg-black/30 hover:bg-slate-800/50 border border-slate-800 p-3 rounded-xl cursor-pointer flex justify-between items-center group transition-all">
                                                    <div className="text-xs text-slate-300 truncate pr-4">{item.desc}</div>
                                                    <div className="text-[9px] font-mono text-slate-600 shrink-0 group-hover:text-blue-500">{item.fecha}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {resultado && (
                                    <div className="glass-panel p-10 rounded-3xl border-l-4 border-l-blue-500 fade-in shadow-2xl relative bg-slate-900">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700 pb-4 mb-6 gap-4">
                                            <div>
                                                <div className="text-[10px] font-black text-blue-400 uppercase tracking-tighter">Resultado del Orquestador</div>
                                                <div className="text-[9px] font-bold text-slate-500 uppercase mt-1">
                                                    Agente: <span className="text-purple-400">{infoOrquestador?.agentes}</span> | 
                                                    Plantilla: <span className="text-green-400">{infoOrquestador?.plantilla}</span> | 
                                                    Internet: <span className="text-yellow-500">{infoOrquestador?.internet}</span>
                                                </div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={()=>navigator.clipboard.writeText(resultado.replace(/<[^>]*>/g, ''))} className="text-[9px] font-black bg-slate-800 px-3 py-2 rounded border border-slate-700 hover:bg-slate-700 uppercase">Copia</button>
                                                <button onClick={() => {
                                                    const blob = new Blob(['\ufeff', `<html><body>${resultado}</body></html>`], { type: 'application/msword' });
                                                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Analisis_BG.doc'; a.click();
                                                }} className="text-[9px] font-black bg-blue-900/40 px-3 py-2 rounded border border-blue-500/30 hover:bg-blue-800/60 uppercase">Word</button>
                                                <button onClick={() => window.print()} className="text-[9px] font-black bg-purple-900/40 px-3 py-2 rounded border border-purple-500/30 hover:bg-purple-800/60 uppercase">Imprimir</button>
                                            </div>
                                        </div>
                                        <div className="ai-output-container" dangerouslySetInnerHTML={{ __html: resultado }}></div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'agentes' && (
                            <div className="max-w-5xl mx-auto space-y-6 fade-in pb-10">
                                <div className="flex justify-between items-center"><h2 className="text-xl font-bold uppercase tracking-widest text-white">Gestión de Agentes Especialistas</h2><button onClick={()=>{setAgents([...agents,{id:Date.now(),nombre:'Nuevo Agente',instrucciones:''}]); uploadToCloud(true);}} className="bg-blue-600 px-6 py-2.5 rounded-xl text-[10px] font-black uppercase shadow-lg">+ Crear Agente</button></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">{agents.map((ag, i) => (
                                    <div key={ag.id} className="glass-panel p-6 rounded-2xl space-y-4 shadow-xl border border-white/5 relative">
                                        <input value={ag.nombre} onChange={e=>{const n=[...agents]; n[i].nombre=e.target.value; setAgents(n);}} onBlur={()=>uploadToCloud(true)} className="w-full text-blue-400 font-black uppercase text-sm bg-black/40 border-none px-4 py-2" />
                                        <textarea value={ag.instrucciones} onChange={e=>{const n=[...agents]; n[i].instrucciones=e.target.value; setAgents(n);}} onBlur={()=>uploadToCloud(true)} placeholder="Define su personalidad y límites..." className="w-full h-40 text-xs focus:outline-none bg-slate-900/30 p-4 border border-slate-800" />
                                        <button onClick={()=>{setAgents(agents.filter(x=>x.id!==ag.id)); setTimeout(()=>uploadToCloud(true),200);}} className="text-red-500 text-[10px] font-black uppercase flex items-center gap-1 hover:bg-red-500/10 p-2 rounded transition-all"><Icons.Trash2/> Eliminar Especialista</button>
                                    </div>
                                ))}</div>
                            </div>
                        )}

                        {activeTab === 'plantillas' && (
                            <div className="max-w-5xl mx-auto space-y-6 fade-in pb-10">
                                <div className="flex justify-between items-center"><h2 className="text-xl font-bold uppercase tracking-widest text-white">Librería de Formatos</h2><button onClick={()=>{setTemplates([...templates,{id:Date.now(),nombre:'Nueva Plantilla',descripcion:'',ejemplo:''}]); uploadToCloud(true);}} className="bg-purple-600 px-6 py-2.5 rounded-xl text-[10px] font-black uppercase shadow-lg">+ Crear Plantilla</button></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">{templates.map((t, i) => (
                                    <div key={t.id} className="glass-panel p-6 rounded-2xl space-y-4 shadow-xl">
                                        <input value={t.nombre} onChange={e=>{const n=[...templates]; n[i].nombre=e.target.value; setTemplates(n);}} onBlur={()=>uploadToCloud(true)} className="w-full text-purple-400 font-black uppercase text-sm bg-black/40 border-none px-4 py-2" />
                                        <textarea value={t.descripcion} onChange={e=>{const n=[...templates]; n[i].descripcion=e.target.value; setTemplates(n);}} onBlur={()=>uploadToCloud(true)} placeholder="Cómo debe estructurarse la respuesta..." className="w-full h-28 text-xs focus:outline-none bg-slate-900/30 p-4" />
                                        <div className="p-4 bg-black/40 rounded-xl"><label className="text-[9px] font-black text-slate-500 uppercase block mb-1">Cargar Estilo desde Archivo</label>
                                        <input type="file" onChange={async e=>{setLoading(true); const txt=await extractTextFromFile(e.target.files[0]); const n=[...templates]; n[i].ejemplo=txt.substring(0,8000); setTemplates(n); uploadToCloud(true); setLoading(false); alert("Estilo capturado con éxito.");}} className="text-[10px] w-full" /></div>
                                        <button onClick={()=>{setTemplates(templates.filter(x=>x.id!==t.id)); setTimeout(()=>uploadToCloud(true),200);}} className="text-red-500 text-[10px] font-black uppercase flex items-center gap-1 hover:bg-red-500/10 p-2 rounded transition-all"><Icons.Trash2/> Eliminar Formato</button>
                                    </div>
                                ))}</div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="max-w-2xl mx-auto space-y-8 fade-in pb-10">
                                {/* CONFIG IA */}
                                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
                                    <div className="flex items-center gap-4 mb-6 border-b border-slate-700 pb-4"><div className="p-3 bg-purple-500/20 rounded-xl text-purple-400 flex items-center justify-center"><Icons.Brain/></div><div><h2 className="text-2xl font-bold text-white uppercase tracking-widest">Protocolo iA</h2></div></div>
                                    <label className="block text-sm font-bold text-slate-300 mb-2">Google Gemini API Key</label>
                                    <div className="relative mb-4">
                                        <input type={showKey?"text":"password"} value={apiKey} onChange={e=>{setApiKey(e.target.value);}} onBlur={()=>uploadToCloud(true)} className="w-full bg-black/50 border border-slate-700 rounded-xl p-4 font-mono text-white focus:outline-none focus:border-purple-500"/>
                                        <button onClick={()=>setShowKey(!showKey)} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500">{showKey?<Icons.EyeOff/>:<Icons.Eye/>}</button>
                                    </div>
                                    <div className="flex justify-end mb-8"><button onClick={testConnection} disabled={testStatus==='loading'} className={`px-6 py-2 rounded-xl border font-black text-[10px] uppercase flex items-center gap-2 transition-all shadow-md ${testStatus==='success'?'bg-green-600 text-white border-green-500':'bg-slate-800 text-slate-400 border-slate-700'}`}>{testStatus==='loading'?<Icons.Loader/>:testStatus==='success'?<Icons.CheckCircle/>:'Verificar Conexión'}</button></div>
                                    
                                    <label className="block text-sm font-bold text-slate-300 uppercase tracking-widest mb-4">Modelos Disponibles</label>
                                    <div className="flex flex-wrap gap-2 mb-6">
                                        {availableModels.map(m=>(<div key={m} className={`flex items-center gap-2 px-3 py-2 rounded-lg border text-[10px] font-mono ${aiModel===m?'bg-blue-900/30 border-blue-500 text-blue-300':'bg-slate-800 border-slate-700 text-slate-400'}`}><span>{m}</span>{availableModels.length>1&&(<button onClick={()=>{setAvailableModels(prev=>{const n=prev.filter(x=>x!==m); if(aiModel===m) setAiModel(n[0]); return n;}); uploadToCloud(true);}} className="text-red-500 font-bold ml-1">✕</button>)}</div>))}
                                    </div>
                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex gap-2"><input type="text" id="newMod" placeholder="ID del nuevo modelo..." className="flex-1 text-xs bg-transparent border-none text-white focus:ring-0"/><button onClick={()=>{const i=document.getElementById('newMod'); if(i.value){setAvailableModels(p=>[...p,i.value]); i.value=''; uploadToCloud(true);}}} className="bg-blue-600 px-6 rounded-xl font-black text-[10px] uppercase text-white">Añadir</button></div>
                                </div>

                                {/* SYNC CLOUD */}
                                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
                                    <div className="flex items-center gap-4 mb-6 border-b border-slate-700 pb-4"><div className="p-3 bg-blue-500/20 rounded-xl text-blue-400 flex justify-center items-center"><Icons.Globe/></div><div><h2 className="text-2xl font-bold text-white uppercase tracking-widest">Sincronización Cloud</h2></div></div>
                                    <div className="flex items-end gap-2 mb-6">
                                        <div className="flex-1"><label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">URL del Google Script</label>
                                        <div className="relative">
                                            <input type={showUrl ? "text" : "password"} value={simpleDecrypt(gScriptUrl)} onChange={e=>{setGScriptUrl(simpleEncrypt(e.target.value));}} onBlur={()=>uploadToCloud(true)} className="w-full bg-black/50 border border-slate-700 rounded-xl p-4 font-mono text-xs text-white focus:outline-none focus:border-blue-500"/>
                                            <button onClick={()=>setShowUrl(!showUrl)} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500">{showUrl ? <Icons.EyeOff/> : <Icons.Eye/>}</button>
                                        </div></div>
                                        <button onClick={()=>uploadToCloud(false)} className="bg-blue-600 hover:bg-blue-500 p-4 rounded-xl shadow-lg transition-all text-white border border-blue-500"><Icons.Refresh/></button>
                                    </div>
                                </div>

                                {/* PIN Y BACKUP */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl">
                                        <h3 className="text-xs font-black text-red-500 uppercase mb-4 tracking-widest flex items-center gap-2"><Icons.EyeOff/> Bloqueo PIN</h3>
                                        <input type="password" value={appPin} onChange={e=>{setAppPin(e.target.value.replace(/\D/g,'').slice(0,4)); uploadToCloud(true);}} placeholder="4 DIGITOS" className="w-full bg-black border border-slate-700 text-center text-3xl font-mono p-4 rounded-xl text-white outline-none focus:border-red-500" />
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl flex flex-col justify-center gap-3">
                                        <button onClick={()=>{const d=JSON.stringify({agents,templates,apiKey}); const b=new Blob([d],{type:"application/json"}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=`BG_Backup.json`; a.click();}} className="w-full bg-slate-800 py-3 rounded-xl font-black text-[10px] uppercase border border-slate-700 transition-all text-white">Exportar Backup</button>
                                        <label className="w-full bg-blue-600 py-3 rounded-xl font-black text-[10px] uppercase text-center cursor-pointer text-white block transition-all">Importar JSON<input type="file" className="hidden" onChange={(e)=>{const f=e.target.files[0]; const r=new FileReader(); r.onload=(ev)=>{const d=JSON.parse(ev.target.result); if(d.agents)setAgents(d.agents); if(d.templates)setTemplates(d.templates); alert("Datos restaurados."); uploadToCloud(true);}; r.readAsText(f);}}/></label>
                                    </div>
                                </div>

                                {/* ESTADO SISTEMA */}
                                <div className="bg-slate-900 p-10 rounded-3xl border border-slate-800 shadow-2xl">
                                    <h2 className="text-xl font-bold mb-6 uppercase tracking-widest text-white">Verificación de Licencia</h2>
                                    <div className="bg-black/40 p-6 rounded-2xl border border-slate-700">
                                        <div className="flex gap-3">
                                            <input type="text" id="licInputHash" placeholder="HASH DE ACTIVACIÓN" className="flex-1 bg-slate-900 border border-slate-700 p-3 font-mono text-white uppercase outline-none focus:border-green-500" />
                                            <button onClick={()=>{const v=document.getElementById('licInputHash').value; if(_0x8f(v)){_s_set(_0xT); uploadToCloud(true); alert("SISTEMA ACTIVADO");}else{alert("HASH NO VÁLIDO");}}} className="bg-blue-600 px-8 rounded-xl font-black text-xs uppercase text-white">Validar</button>
                                        </div>
                                        {_0xAuth && <div className="mt-4 text-green-400 text-[10px] font-black tracking-widest animate-pulse flex items-center gap-2 uppercase"><Icons.CheckCircle/> Licencia de uso Profesional Activa</div>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="shrink-0 bg-slate-900 border-t border-slate-800 py-2 px-6 flex justify-between items-center text-[8px] text-slate-500 font-bold uppercase tracking-[0.2em]">
                        <div>BoardingGate Agent v2.4 (Core Orchestrator)</div>
                        <div className="flex gap-6">
                            <span className={syncStatus === 'syncing' ? 'text-yellow-500 animate-pulse' : ''}>Sincronización: {syncStatus==='synced'?'Nube OK':syncStatus==='syncing'?'Guardando...':'Local'}</span>
                            <span>Seguridad: {_0xAuth?'Encriptado':'Básico'}</span>
                        </div>
                    </footer>
                </div>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
