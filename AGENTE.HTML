<!DOCTYPE html>
<html lang="es"> 
<head> 
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BoardingGate - Multi Agente iA</title>
    
    <script src="//cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: auto; background-color: #0a0a0a; font-family: 'Inter', sans-serif; color: #e5e5e5; }
        #root { height: 100dvh; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        .glass-panel { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input, select, textarea { background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; padding: 8px; transition: all 0.2s; font-size: 14px; }
        .active-tab { background-color: #2563eb; color: white; box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }

        .ai-output-container { font-family: 'Inter', sans-serif; color: #e2e8f0; line-height: 1.6; }
        .ai-output-container h1, .ai-output-container h2, .ai-output-container h3 { color: #60a5fa; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-top: 24px; font-weight: 700; text-transform: uppercase; }
        .ai-output-container table { width: 100%; border-collapse: collapse; margin: 20px 0; background: rgba(30, 41, 59, 0.5); }
        .ai-output-container th { background: #1e293b; color: #93c5fd; padding: 12px; border: 1px solid #334155; text-align: left; }
        .ai-output-container td { padding: 12px; border: 1px solid #334155; }
        .ai-output-container ul { list-style: disc; padding-left: 25px; margin: 15px 0; }
        
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .ai-output-container { color: black !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;
        const { createRoot } = ReactDOM;

        const DEFAULT_AI_MODELS = ["gemini-2.0-flash-exp", "gemini-1.5-pro", "gemini-1.5-flash"];
        const _0xL = '__sys_reg_st'; 
        const _0xT = 'ACTIVATED_V3_SECURE';
        const _0x8f = (k) => { try { const _d = new Date(); const _v = Object.values(new Intl.DateTimeFormat('es').formatToParts(_d)).filter(p => ['day', 'month', 'year'].includes(p.type)).reduce((a, b) => a + parseInt(b.value), 0) * _d.getDate(); return k === _v.toString(16).toUpperCase(); } catch { return false; } };

        const simpleEncrypt = (t) => { if(!t) return ''; try { return btoa(t.split('').map((c, i) => String.fromCharCode(c.charCodeAt(0) + (i % 5))).join('')); } catch { return t; } };
        const simpleDecrypt = (t) => { if(!t) return ''; try { return atob(t).split('').map((c, i) => String.fromCharCode(c.charCodeAt(0) - (i % 5))).join(''); } catch { return t; } };

        const usePersistentState = (key, initialValue) => {
            const [state, setState] = useState(() => { try { const item = window.localStorage.getItem(key); return item ? JSON.parse(item) : initialValue; } catch { return initialValue; } });
            useEffect(() => { window.localStorage.setItem(key, JSON.stringify(state)); }, [key, state]); return [state, setState];
        };

        const Icons = {
            Brain: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.48Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.48Z"/></svg>,
            Settings: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            Users: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            FileText: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>,
            Upload: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            Trash: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Search: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            Magic: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M15 4V2m0 14v-2M8 9h2m10 0h2m-4.2-4.2L14.4 6.2M4.2 15.8l1.4-1.4M18.5 18l-7-7L7 15.5l7 7 4.5-4.5z"/></svg>,
            Refresh: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>,
            History: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            AlertCircle: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Globe: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
            Plus: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18" {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Loader: (p) => <svg className="animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" width="18" height="18"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        };

        const extractTextFromFile = async (file) => {
            const ext = file.name.split('.').pop().toLowerCase();
            try {
                if (ext === 'pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let text = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(item => item.str).join(' ') + "\n";
                    }
                    return text;
                } else if (ext === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const res = await mammoth.extractRawText({ arrayBuffer });
                    return res.value;
                } else if (ext === 'xlsx' || ext === 'xls') {
                    const wb = XLSX.read(await file.arrayBuffer());
                    let text = "";
                    wb.SheetNames.forEach(s => text += XLSX.utils.sheet_to_txt(wb.Sheets[s]) + "\n");
                    return text;
                }
            } catch (e) { return `[Error procesando ${file.name}]`; }
            return "";
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [apiKey, setApiKey] = usePersistentState('bg_ag_api_key', '');
            const [gScriptUrl, setGScriptUrl] = usePersistentState('bg_ag_gs_url', '');
            const [aiModel, setAiModel] = usePersistentState('bg_ag_ai_model', DEFAULT_AI_MODELS[0]);
            const [availableModels, setAvailableModels] = usePersistentState('bg_ag_models_list', DEFAULT_AI_MODELS);
            const [appPin, setAppPin] = usePersistentState('bg_ag_pin', '');
            const [_s_st, _s_set] = usePersistentState(_0xL, '');
            const [localTimestamp, setLocalTimestamp] = usePersistentState('bg_ag_ts', Date.now());
            
            const [agents, setAgents] = usePersistentState('bg_ag_agents_data', [{id: 1, nombre: 'Analista Senior', instrucciones: 'Eres un analista CFA.'}]);
            const [templates, setTemplates] = usePersistentState('bg_ag_temps_data', [{id: 1, nombre: 'Informe', descripcion: 'Formato informe ejecutivo.'}]);
            const [history, setHistory] = usePersistentState('bg_ag_history_v3', []);
            
            const [loading, setLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState('');
            const [syncStatus, setSyncStatus] = useState('idle');
            const [isPinLocked, setIsPinLocked] = useState(!!appPin);
            const [enteredPin, setEnteredPin] = useState('');
            
            const [peticion, setPeticion] = useState('');
            const [archivos, setArchivos] = useState([]);
            const [resultado, setResultado] = useState('');
            const [infoOrquestador, setInfoOrquestador] = useState(null);
            
            const [searchAgents, setSearchAgents] = useState('');
            const [searchTemplates, setSearchTemplates] = useState('');
            const [searchHistory, setSearchHistory] = useState('');

            const _0xAuth = useMemo(() => _s_st === _0xT, [_s_st]);

            const callGemini = async (prompt, model, useSearch = false) => {
                const body = { contents: [{ parts: [{ text: prompt }] }] };
                if (useSearch) body.tools = [{ google_search: {} }];
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text;
            };

            const uploadToCloud = useCallback(async (isAuto = false) => {
                const url = simpleDecrypt(gScriptUrl); if (!url) return;
                setSyncStatus('syncing');
                try {
                    const now = Date.now();
                    const payload = { timestamp: now, agents, templates, history, apiKey, aiModel, availableModels, appPin, _s_st };
                    await fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                    setLocalTimestamp(now); setSyncStatus('synced');
                } catch (e) { setSyncStatus('error'); }
            }, [agents, templates, history, apiKey, aiModel, availableModels, appPin, _s_st, gScriptUrl]);

            const downloadFromCloud = async () => {
                const url = simpleDecrypt(gScriptUrl); if (!url) return;
                try {
                    const resp = await fetch(url); const data = await resp.json();
                    if (data.timestamp > localTimestamp) {
                        if(data.agents) setAgents(data.agents); if(data.templates) setTemplates(data.templates);
                        if(data.history) setHistory(data.history); if(data.apiKey) setApiKey(data.apiKey);
                    }
                } catch (e) { console.error(e); }
            };

            const autoPromptAgent = async (idx) => {
                const name = agents[idx].nombre; if(!name) return alert("Pon un nombre al agente.");
                setLoading(true); setStatusMsg("Diseñando cerebro del agente...");
                try {
                    const res = await callGemini(`Escribe un prompt de sistema profesional para un agente iA experto llamado "${name}". Define su tono, conocimientos técnicos y metodología de análisis. Sé muy detallado.`, aiModel);
                    const n = [...agents]; n[idx].instrucciones = res; setAgents(n); uploadToCloud(true);
                } catch(e) { alert(e.message); } finally { setLoading(false); }
            };

            const autoPromptTemplate = async (idx) => {
                const name = templates[idx].nombre; if(!name) return alert("Pon un nombre a la plantilla.");
                setLoading(true); setStatusMsg("Diseñando estructura de informe...");
                try {
                    const res = await callGemini(`Escribe una descripción técnica para un formato de salida de iA llamado "${name}". Indica cómo deben usarse las tablas, los encabezados y qué secciones clave no pueden faltar para un resultado impecable.`, aiModel);
                    const n = [...templates]; n[idx].descripcion = res; setTemplates(n); uploadToCloud(true);
                } catch(e) { alert(e.message); } finally { setLoading(false); }
            };

            const procesarMision = async () => {
                if(!apiKey) return setActiveTab('settings');
                if(!peticion.trim()) return;
                setLoading(true); setResultado('');
                try {
                    setStatusMsg("Extrayendo contexto de archivos...");
                    let contextDoc = "";
                    for(const f of archivos) contextDoc += `\n- DOCUMENTO: ${f.name}\n${await extractTextFromFile(f)}\n`;
                    
                    setStatusMsg("Seguridad de Red: Validando misión...");
                    const checkPrompt = `Analiza la misión: "${peticion}". Agentes: ${JSON.stringify(agents.map(a=>a.nombre))}. Formatos: ${JSON.stringify(templates.map(t=>t.nombre))}. 
                    Responde SOLO en JSON: {"valid":boolean, "mensaje_usuario":"string", "agente":"nombre", "plantilla":"nombre", "search":boolean, "query":"string"}. 
                    Si la misión es ambigua o faltan datos críticos de los archivos para poder responder, pon valid=false y pide educadamente lo que falta.`;
                    
                    const routerRes = await callGemini(checkPrompt, aiModel);
                    const decision = JSON.parse(routerRes.match(/\{[\s\S]*\}/)[0]);
                    
                    if(!decision.valid) {
                        setResultado(`<div class="bg-red-900/20 border border-red-500 p-6 rounded-2xl text-red-400 font-bold uppercase tracking-widest text-center"><Icons.AlertCircle className="mx-auto mb-2"/> ORQUESTADOR BLOQUEADO: ${decision.mensaje_usuario}</div>`);
                        setLoading(false); return;
                    }

                    let internet = "";
                    if(decision.search) {
                        setStatusMsg(`Mejora Activa: Consultando red global sobre "${decision.query}"...`);
                        internet = await callGemini(`Briefing completo y verídico sobre: ${decision.query}`, aiModel, true);
                    }
                    
                    const ag = agents.find(a=>a.nombre===decision.agente) || agents[0];
                    const tp = templates.find(t=>t.nombre===decision.plantilla) || templates[0];
                    setInfoOrquestador({ agentes: ag.nombre, plantilla: tp.nombre, internet: decision.search ? 'Sí' : 'No' });

                    setStatusMsg(`Agente ${ag.nombre} generando informe estratégico...`);
                    const finalPrompt = `ROL: ${ag.instrucciones}. FORMATO: ${tp.descripcion}. ESTILO: ${tp.ejemplo}. INTERNET: ${internet}. DOCS: ${contextDoc}. PETICION: ${peticion}. REGLA: SIN ALUCINACIONES. HTML PURO.`;
                    const res = await callGemini(finalPrompt, aiModel);
                    setResultado(res.replace(/```html/g, '').replace(/```/g, ''));
                    
                    setHistory(prev => [{id: Date.now(), texto: peticion, desc: peticion.substring(0,60)+'...'}, ...prev].slice(0, 15));
                    uploadToCloud(true);
                } catch(e) { alert(e.message); } finally { setLoading(false); setStatusMsg(''); }
            };

            const filteredHistory = history.filter(h => h.texto.toLowerCase().includes(searchHistory.toLowerCase()));
            const filteredAgents = agents.filter(a => a.nombre.toLowerCase().includes(searchAgents.toLowerCase()));
            const filteredTemplates = templates.filter(t => t.nombre.toLowerCase().includes(searchTemplates.toLowerCase()));

            useEffect(() => { downloadFromCloud(); }, []);

            if(isPinLocked) {
                return (
                    <div className="h-full flex flex-col items-center justify-center bg-[#0a0a0a]">
                        <div className="bg-slate-900 border border-slate-800 p-10 rounded-3xl text-center shadow-2xl">
                            <Icons.Brain size={50} className="mx-auto text-blue-600 mb-6"/>
                            <input type="password" value={enteredPin} onChange={e=>{const v=e.target.value.slice(0,4); setEnteredPin(v); if(v===appPin) setIsPinLocked(false);}} placeholder="PIN" className="w-full bg-black border border-slate-700 p-4 text-center text-3xl font-mono text-white" autoFocus />
                        </div>
                    </div>
                );
            }

            return (
                <div id="root">
                    <header className="shrink-0 bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center z-50">
                        <div><h1 className="text-2xl font-bold font-['Orbitron']">Boarding<span className="text-blue-600">Gate</span></h1><p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Multi-Agente iA</p></div>
                        <nav className="flex bg-slate-800 rounded-xl p-1 gap-1 border border-slate-700 overflow-x-auto">
                            <button onClick={()=>setActiveTab('dashboard')} className={`px-5 py-2.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 ${activeTab==='dashboard'?'active-tab':'text-slate-400'}`}><Icons.Brain/> Dashboard</button>
                            <button onClick={()=>setActiveTab('agentes')} className={`px-5 py-2.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 ${activeTab==='agentes'?'active-tab':'text-slate-400'}`}><Icons.Users/> Agentes</button>
                            <button onClick={()=>setActiveTab('plantillas')} className={`px-5 py-2.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 ${activeTab==='plantillas'?'active-tab':'text-slate-400'}`}><Icons.FileText/> Formatos</button>
                            <button onClick={()=>setActiveTab('settings')} className={`px-5 py-2.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 ${activeTab==='settings'?'active-tab':'text-slate-400'}`}><Icons.Settings/> Ajustes</button>
                        </nav>
                    </header>

                    <main className="flex-1 overflow-y-auto custom-scrollbar p-6">
                        {loading && (
                            <div className="absolute inset-0 z-[200] bg-black/80 flex flex-col items-center justify-center">
                                <Icons.Loader size={60} className="text-blue-500 mb-6"/><div className="text-xl font-bold text-white uppercase tracking-widest animate-pulse px-6 text-center">{statusMsg}</div>
                            </div>
                        )}

                        {activeTab === 'dashboard' && (
                            <div className="max-w-4xl mx-auto space-y-6 fade-in pb-10">
                                <div className="glass-panel p-8 rounded-3xl space-y-6 shadow-2xl">
                                    <div className="flex justify-between items-center text-xs font-black uppercase text-blue-400 tracking-widest">
                                        <span>Entrada de Misión</span>
                                        <div className="flex gap-4">
                                            <button onClick={()=>setPeticion('')} className="text-[9px] text-red-500 font-black uppercase">Limpiar</button>
                                            <select value={aiModel} onChange={e=>setAiModel(e.target.value)} className="text-[10px] font-bold px-3 py-1 bg-slate-900 border-slate-700 text-white">{availableModels.map(m=><option key={m} value={m}>{m}</option>)}</select>
                                        </div>
                                    </div>
                                    <textarea value={peticion} onChange={e=>setPeticion(e.target.value)} placeholder="Introduce la misión estratégica..." className="w-full h-44 bg-slate-950 border border-slate-700 rounded-2xl p-6 text-sm outline-none focus:border-blue-500 transition-all" />
                                    <div className="flex flex-col gap-4">
                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                            <label className="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 rounded-2xl p-4 cursor-pointer hover:border-blue-500 bg-slate-800/20">
                                                <input type="file" multiple onChange={e=>setArchivos([...archivos,...Array.from(e.target.files)])} className="hidden"/><Icons.Upload size={24}/>
                                                <span className="text-[9px] font-black text-slate-500 mt-1 uppercase">Subir</span>
                                                <span className="text-[7px] text-slate-600 uppercase font-black">PDF, DOCX, XLSX</span>
                                            </label>
                                            <button onClick={procesarMision} className="md:col-span-3 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black uppercase text-xs shadow-2xl py-4 transition-all active:scale-95">Ejecutar Misión Estratégica</button>
                                        </div>
                                        <div className="flex flex-wrap gap-2">{archivos.map((f,i)=><div key={i} className="bg-blue-900/40 border border-blue-500/30 px-3 py-1 rounded-full text-[9px] font-bold text-blue-300 flex items-center">{f.name} <button onClick={()=>setArchivos(archivos.filter((_,x)=>x!==i))} className="ml-2">✕</button></div>)}</div>
                                    </div>
                                </div>

                                {history.length > 0 && (
                                    <div className="glass-panel p-6 rounded-3xl space-y-4">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                            <h3 className="text-[10px] font-black text-slate-500 uppercase flex items-center gap-2"><Icons.History/> Misiones Recientes</h3>
                                            <div className="relative w-full md:w-64"><Icons.Search className="absolute left-3 top-2.5 text-slate-600" size={14}/><input type="text" value={searchHistory} onChange={e=>setSearchHistory(e.target.value)} placeholder="BUSCAR PETICIÓN..." className="w-full pl-10 text-[9px] uppercase font-black py-2 bg-black/40 border-slate-800"/></div>
                                        </div>
                                        <div className="space-y-1">
                                            {filteredHistory.map(h => (
                                                <div key={h.id} onClick={()=>setPeticion(h.texto)} className="bg-black/30 hover:bg-slate-800 p-2.5 rounded-xl text-xs cursor-pointer border border-slate-800 transition-all flex justify-between items-center group">
                                                    <span className="truncate pr-4 text-slate-400 group-hover:text-blue-400">{h.desc}</span>
                                                    <Icons.Plus size={12} className="text-slate-700 group-hover:text-blue-500"/>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {resultado && (
                                    <div className="glass-panel p-10 rounded-3xl border-l-4 border-l-blue-500 fade-in shadow-2xl relative bg-slate-900">
                                        <div className="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
                                            <div className="text-[9px] font-bold text-slate-500 uppercase">Agente: <span className="text-purple-400">{infoOrquestador?.agentes}</span> | Red: <span className="text-blue-400">{infoOrquestador?.internet}</span></div>
                                            <button onClick={()=>navigator.clipboard.writeText(resultado.replace(/<[^>]*>/g, ''))} className="text-[9px] font-black bg-slate-800 px-3 py-1.5 rounded border border-slate-700 uppercase">Copiar Informe</button>
                                        </div>
                                        <div className="ai-output-container" dangerouslySetInnerHTML={{ __html: resultado }}></div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'agentes' && (
                            <div className="max-w-5xl mx-auto space-y-6 fade-in pb-10">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                    <h2 className="text-xl font-bold uppercase tracking-widest text-white">Agentes Especialistas</h2>
                                    <div className="flex gap-4 w-full md:w-auto">
                                        <div className="relative flex-1 md:w-64"><Icons.Search className="absolute left-3 top-2.5 text-slate-600" size={14}/><input type="text" value={searchAgents} onChange={e=>setSearchAgents(e.target.value)} placeholder="FILTRAR AGENTES..." className="w-full pl-10 text-[9px] uppercase font-black py-2 bg-black/40 border-slate-800"/></div>
                                        <button onClick={()=>{setAgents([...agents,{id:Date.now(),nombre:'Nuevo Agente',instrucciones:''}]); uploadToCloud(true);}} className="bg-blue-600 px-6 py-2 rounded-xl text-[10px] font-black uppercase">+ Crear</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">{filteredAgents.map((ag, i) => (
                                    <div key={ag.id} className="glass-panel p-6 rounded-2xl space-y-4 shadow-xl border border-white/5 relative group">
                                        <div className="flex justify-between gap-4">
                                            <input value={ag.nombre} onChange={e=>{const n=[...agents]; n[i].nombre=e.target.value; setAgents(n);}} onBlur={()=>uploadToCloud(true)} className="flex-1 text-blue-400 font-black uppercase text-sm bg-black/40 border-none px-4 py-2" />
                                            <button onClick={()=>autoPromptAgent(i)} className="bg-purple-900/40 border border-purple-500/30 p-2 rounded-xl text-purple-400 hover:bg-purple-500 hover:text-white transition-all shadow-lg" title="Autogenerar con iA"><Icons.Magic/></button>
                                        </div>
                                        <textarea value={ag.instrucciones} onChange={e=>{const n=[...agents]; n[i].instrucciones=e.target.value; setAgents(n);}} onBlur={()=>uploadToCloud(true)} placeholder="Describe qué hace este agente..." className="w-full h-40 text-xs focus:outline-none bg-slate-900/30 p-4 border border-slate-800 custom-scrollbar" />
                                        <button onClick={()=>{setAgents(agents.filter(x=>x.id!==ag.id)); setTimeout(()=>uploadToCloud(true),200);}} className="text-red-500 text-[10px] font-black uppercase flex items-center gap-1 hover:bg-red-500/10 p-2 rounded transition-all"><Icons.Trash2/> Eliminar</button>
                                    </div>
                                ))}</div>
                            </div>
                        )}

                        {activeTab === 'plantillas' && (
                            <div className="max-w-5xl mx-auto space-y-6 fade-in pb-10">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                    <h2 className="text-xl font-bold uppercase tracking-widest text-white">Modelos de Salida</h2>
                                    <div className="flex gap-4 w-full md:w-auto">
                                        <div className="relative flex-1 md:w-64"><Icons.Search className="absolute left-3 top-2.5 text-slate-600" size={14}/><input type="text" value={searchTemplates} onChange={e=>setSearchTemplates(e.target.value)} placeholder="FILTRAR FORMATOS..." className="w-full pl-10 text-[9px] uppercase font-black py-2 bg-black/40 border-slate-800"/></div>
                                        <button onClick={()=>{setTemplates([...templates,{id:Date.now(),nombre:'Nuevo Formato',descripcion:'',ejemplo:''}]); uploadToCloud(true);}} className="bg-purple-600 px-6 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg">+ Crear</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">{filteredTemplates.map((t, i) => (
                                    <div key={t.id} className="glass-panel p-6 rounded-2xl space-y-4 shadow-xl border border-white/5">
                                        <div className="flex justify-between gap-4">
                                            <input value={t.nombre} onChange={e=>{const n=[...templates]; n[i].nombre=e.target.value; setTemplates(n);}} onBlur={()=>uploadToCloud(true)} className="flex-1 text-purple-400 font-black uppercase text-sm bg-black/40 border-none px-4 py-2" />
                                            <button onClick={()=>autoPromptTemplate(i)} className="bg-blue-900/40 border border-blue-500/30 p-2 rounded-xl text-blue-400 hover:bg-blue-500 hover:text-white transition-all shadow-lg" title="Autogenerar con iA"><Icons.Magic/></button>
                                        </div>
                                        <textarea value={t.descripcion} onChange={e=>{const n=[...templates]; n[i].descripcion=e.target.value; setTemplates(n);}} onBlur={()=>uploadToCloud(true)} placeholder="Describe la estructura deseada..." className="w-full h-28 text-xs focus:outline-none bg-slate-900/30 p-4 border border-slate-800" />
                                        <div className="p-4 bg-black/40 rounded-xl space-y-2">
                                            <label className="text-[9px] font-black text-slate-500 uppercase block">Cargar archivo de ejemplo</label>
                                            <input type="file" onChange={async e=>{setLoading(true); const txt=await extractTextFromFile(e.target.files[0]); const n=[...templates]; n[i].ejemplo=txt.substring(0,8000); setTemplates(n); uploadToCloud(true); setLoading(false); alert("Estilo copiado.");}} className="text-[10px] w-full" />
                                            <span className="text-[7px] text-slate-600 uppercase font-black">ADMITIDOS: PDF, DOCX, XLSX</span>
                                        </div>
                                        <button onClick={()=>{setTemplates(templates.filter(x=>x.id!==t.id)); setTimeout(()=>uploadToCloud(true),200);}} className="text-red-500 text-[10px] font-black uppercase flex items-center gap-1 hover:bg-red-500/10 p-2 rounded transition-all"><Icons.Trash2/> Eliminar</button>
                                    </div>
                                ))}</div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="max-w-2xl mx-auto space-y-8 fade-in pb-10">
                                {/* CONFIG IA EXACTO BOLSA */}
                                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
                                    <div className="flex items-center gap-4 mb-6 border-b border-slate-700 pb-4"><div className="p-3 bg-purple-500/20 rounded-xl text-purple-400 flex items-center justify-center"><Icons.Brain/></div><div><h2 className="text-2xl font-bold text-white uppercase tracking-widest">IA Protocol</h2></div></div>
                                    <label className="block text-sm font-bold text-slate-300 mb-2">API Key de Gemini</label>
                                    <div className="relative mb-4"><input type={showKey?"text":"password"} value={apiKey} onChange={e=>{setApiKey(e.target.value);}} onBlur={()=>uploadToCloud(true)} className="w-full bg-black/50 border border-slate-700 rounded-xl p-4 font-mono text-white focus:outline-none focus:border-purple-500"/><button onClick={()=>setShowKey(!showKey)} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500">VAR</button></div>
                                    <label className="block text-sm font-bold text-slate-300 uppercase tracking-widest mb-4">Modelo Activo</label>
                                    <select value={aiModel} onChange={e=>{setAiModel(e.target.value); uploadToCloud(true);}} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-mono text-sm text-white mb-6 outline-none focus:border-purple-500">{availableModels.map(m=><option key={m} value={m}>{m}</option>)}</select>
                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex gap-2"><input type="text" id="newMod" placeholder="ID del Modelo..." className="flex-1 text-xs bg-transparent border-none text-white focus:ring-0"/><button onClick={()=>{const i=document.getElementById('newMod'); if(i.value){setAvailableModels(prev=>[...prev,i.value]); i.value=''; setTimeout(()=>uploadToCloud(true),200);}}} className="bg-blue-600 px-6 rounded-xl font-black text-[10px] uppercase text-white shadow-lg">Añadir</button></div>
                                    <div className="flex flex-wrap gap-2 mt-4">{availableModels.map(m=>(<div key={m} className={`flex items-center gap-2 px-2 py-1.5 rounded-lg border text-[10px] font-mono ${aiModel===m?'bg-blue-900/30 border-blue-500 text-blue-300':'bg-slate-800 border-slate-700 text-slate-400'}`}><span>{m}</span>{availableModels.length>1&&(<button onClick={()=>{setAvailableModels(prev=>prev.filter(x=>x!==m)); setTimeout(()=>uploadToCloud(true),200);}} className="text-red-500 font-bold ml-1">✕</button>)}</div>))}</div>
                                    <div className="mt-8 p-6 bg-[#1e293b] border border-[#334155] rounded-2xl"><h4 className="text-lg font-bold text-blue-400 mb-4 flex items-center gap-2"><Icons.AlertCircle/> Manual API</h4><div className="mb-6 border-b border-slate-700 pb-6"><h5 className="text-sm font-bold text-white mb-3">Opción Gratuita</h5><ol className="list-decimal list-inside text-xs text-slate-300 space-y-2 mb-4 leading-relaxed"><li>Accede a <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-blue-400 font-bold underline">Google AI Studio</a>.</li><li>Copia la clave y pégala arriba.</li></ol></div></div>
                                </div>

                                {/* SYNC GDRIVE EXACTO BOLSA */}
                                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
                                    <div className="flex items-center gap-4 mb-6 border-b border-slate-700 pb-4"><div className="p-3 bg-blue-500/20 rounded-xl text-blue-400 flex justify-center items-center"><Icons.Globe/></div><div><h2 className="text-2xl font-bold text-white uppercase tracking-widest">Sincronización Cloud</h2></div></div>
                                    <div className="flex items-end gap-2 mb-6">
                                        <div className="flex-1"><label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">URL del Script de GDrive</label>
                                        <input type="password" value={simpleDecrypt(gScriptUrl)} onChange={e=>setGScriptUrl(simpleEncrypt(e.target.value))} onBlur={()=>uploadToCloud(true)} className="w-full bg-black/50 border border-slate-700 rounded-xl p-4 font-mono text-xs text-white outline-none focus:border-blue-500"/></div>
                                        <button onClick={()=>uploadToCloud(false)} className="bg-blue-600 hover:bg-blue-500 p-4 rounded-xl shadow-lg transition-all text-white border border-blue-500"><Icons.Refresh/></button>
                                    </div>
                                    <div className="bg-slate-950/80 border border-slate-700 rounded-2xl p-6 text-[11px] text-slate-300 space-y-4 leading-relaxed">
                                        <h5 className="text-xs font-bold text-white mb-4 flex items-center gap-2 uppercase tracking-widest"><Icons.Settings/> Protocolo Persistencia</h5>
                                        <p>Para habilitar el guardado automático en su Google Drive personal, debe desplegar el script proporcionado en la documentación técnica de BoardingGate.</p>
                                    </div>
                                </div>

                                {/* PIE EXACTO BOLSA */}
                                <div className="text-center bg-slate-800/50 p-6 rounded-2xl max-w-2xl w-full mb-10 mx-auto border border-slate-700 shadow-inner">
                                    <p className="text-xs text-slate-400 mb-4 leading-relaxed">Esta plataforma es un proyecto independiente sustentado exclusivamente mediante <strong className="text-slate-300">crowdfunding</strong> y las aportaciones directas de sus usuarios.</p>
                                    <p className="text-xs text-slate-400 mb-3 border-t border-slate-700 pt-5 font-bold uppercase tracking-widest">Colabora con el proyecto:</p>
                                    <a href="https://x.com/BoardingGate" target="_blank" className="inline-flex items-center gap-2 text-blue-400 hover:text-blue-300 font-bold transition-colors bg-blue-900/20 px-6 py-2 rounded-xl border border-blue-500/30 uppercase text-xs tracking-widest shadow-lg"><Icons.Globe/> @BoardingGate en X</a>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="shrink-0 bg-slate-900 border-t border-slate-800 py-1.5 px-6 flex justify-between items-center text-[8px] text-slate-500 font-bold uppercase tracking-[0.2em]">
                        <div>BoardingGate Agent v2.5 (Cybernetic Orchestrator)</div>
                        <div className="flex gap-6">
                            <span className={syncStatus === 'syncing' ? 'text-yellow-500 animate-pulse' : ''}>Sincronización: {syncStatus==='synced'?'Drive OK':syncStatus==='syncing'?'Guardando...':'Local'}</span>
                            <span>Licencia: {_0xAuth?'ACTIVA':'RESTRINGIDA'}</span>
                        </div>
                    </footer>
                </div>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
