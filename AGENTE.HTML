        // --- EXTRACCIÓN DE TEXTO MULTIFORMATO ---
        const extractText = async (file) => {
            const ext = file.name.split('.').pop().toLowerCase();
            try {
                if (ext === 'pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let text = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(item => item.str).join(' ') + "\n";
                    }
                    return text;
                } else if (ext === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    return result.value;
                } else if (ext === 'xlsx' || ext === 'xls') {
                    const arrayBuffer = await file.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer);
                    let text = "";
                    workbook.SheetNames.forEach(sheet => {
                        text += `--- Hoja: ${sheet} ---\n` + XLSX.utils.sheet_to_txt(workbook.Sheets[sheet]) + "\n";
                    });
                    return text;
                }
            } catch (e) { return `Error procesando ${file.name}: ${e.message}`; }
            return "";
        };

        const Modal = ({ isOpen, title, onClose, children, size = "md" }) => {
            if (!isOpen) return null;
            return (

            const [peticion, setPeticion] = useState('');

            // --- LLAMADA A GEMINI ---
            const callGemini = async (prompt, model, useSearch = false) => {
                const body = {
                    contents: [{ parts: [{ text: prompt }] }]
                };
                if (useSearch) {
                    body.tools = [{ google_search: {} }];
                }

                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text;
            };

            // --- ORQUESTADOR INTELIGENTE ---
            const procesarOrquestador = async () => {
                if (!apiKey) return alert("Introduce tu API Key en Ajustes");
                setLoading(true); setResultado('');
                try {
                    // 1. Ingesta
                    setStatusMsg("Leyendo documentos subidos...");
                    let contextDoc = "";
                    for (const f of archivos) {
                        const t = await extractText(f);
                        contextDoc += `\n--- ARCHIVO: ${f.name} ---\n${t}\n`;
                    }

                    // 2. Triaje (Orquestador decide Agente y Plantilla)
                    setStatusMsg("El Orquestador está eligiendo el equipo de agentes...");
                    const routerPrompt = `
                        Eres un Orquestador de IA de alto nivel.
                        PETICIÓN DEL USUARIO: "${peticion}"
                        AGENTES DISPONIBLES: ${JSON.stringify(agents.map(a => a.nombre))}

                        REGLA DE BÚSQUEDA: Si la petición requiere datos actuales (precios de hoy, noticias, leyes recientes), marca 'necesitaInternet' como true.

                        {

                            "plantilla": "Nombre de la plantilla",
                            "necesitaInternet": boolean,

                    const routerRes = await callGemini(routerPrompt, aiModel);

                    // 3. Agente de Búsqueda (si aplica)
                    let internetInfo = "";
                    if (decision.necesitaInternet) {
                        setStatusMsg("Agente de Búsqueda consultando la red...");

                        ${contextDoc}
                        
                        CONTEXTO INTERNET:
                        ${internetInfo}

                        "${peticion}"

                        if (data.availableModels) setAvailableModels(data.availableModels);
                        if (data.appPin) setAppPin(data.appPin);
                        if (data._s_st) _s_set(data._s_st);
                        setLocalTimestamp(data.timestamp);
                    }
                } catch (e) { console.error(e); }
            };

            if(isPinLocked) {

                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
                            <div className="mb-6"><Icons.Brain size={40} className="mx-auto text-blue-600 mb-2"/><h2 className="text-2xl font-display font-bold">Boarding<span className="text-blue-600">Gate</span></h2><p className="text-xs text-slate-400 uppercase tracking-widest">Acceso Restringido</p></div>
                            <input type="password" value={enteredPin} onChange={e => { const val = e.target.value.slice(0,4); setEnteredPin(val); if(val === appPin) setIsPinLocked(false); }} placeholder="PIN" className="w-full bg-black/50 border border-slate-700 rounded-xl p-4 text-center text-3xl font-mono tracking-[1em] text-white focus:border-blue-500 focus:outline-none mb-4" autoFocus />

                            <button onClick={() => setActiveTab('agentes')} className={`px-4 py-2 rounded-md text-[10px] font-bold uppercase flex items-center gap-2 transition-all ${activeTab === 'agentes' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}><Icons.User/> Agentes</button>

                            <button onClick={() => setActiveTab('settings')} className={`px-4 py-2 rounded-md text-[10px] font-bold uppercase flex items-center gap-2 transition-all ${activeTab === 'settings' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}><Icons.Settings/> Ajustes</button>

                    </header>

                    <main className="flex-1 overflow-y-auto custom-scrollbar p-6">

                                    </div>
                                    {archivos.length > 0 && (
                                        <div className="flex flex-wrap gap-2 mt-4">
                                            {archivos.map((f, i) => (
                                                <div key={i} className="bg-blue-600/20 text-blue-300 border border-blue-500/30 px-3 py-1 rounded-full text-[10px] font-bold flex items-center gap-2">
                                                    {f.name} <button onClick={() => setArchivos(archivos.filter((_,idx) => idx !== i))}>✕</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {resultado && (
                                    <div className="glass-panel p-8 rounded-3xl border-l-4 border-l-blue-500 fade-in">
                                        <div className="flex justify-between items-center mb-6">
                                            <h4 className="text-blue-400 font-black text-xs uppercase tracking-widest">Resultado Orquestado</h4>
                                            <button onClick={() => navigator.clipboard.writeText(resultado)} className="text-[10px] font-bold bg-slate-800 px-4 py-2 rounded-xl hover:bg-slate-700">COPIAR TEXTO</button>
                                        </div>
                                        <div className="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap font-sans">
                                            {resultado}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'agentes' && (
                            <div className="max-w-5xl mx-auto space-y-6 fade-in">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-xl font-bold">Gestión de Agentes Expertos</h2>
                                    <button onClick={() => setAgents([...agents, {id: Date.now(), nombre: 'Nuevo Agente', instrucciones: ''}])} className="bg-blue-600 px-6 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shadow-lg"><Icons.Plus/> Crear Agente</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {agents.map((ag, i) => (
                                        <div key={ag.id} className="glass-panel p-6 rounded-2xl space-y-4">
                                            <input value={ag.nombre} onChange={e => { const n = [...agents]; n[i].nombre = e.target.value; setAgents(n); }} className="w-full text-blue-400 font-black uppercase text-sm border-none bg-black/30" />
                                            <textarea value={ag.instrucciones} onChange={e => { const n = [...agents]; n[i].instrucciones = e.target.value; setAgents(n); }} placeholder="Instrucciones del rol..." className="w-full h-40 text-xs leading-relaxed" />
                                            <button onClick={() => setAgents(agents.filter(x => x.id !== ag.id))} className="text-red-500 text-[10px] font-black uppercase flex items-center gap-2"><Icons.Trash/> Eliminar</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'plantillas' && (
                            <div className="max-w-5xl mx-auto space-y-6 fade-in">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-xl font-bold">Biblioteca de Modelos de Salida</h2>
                                    <button onClick={() => setTemplates([...templates, {id: Date.now(), nombre: 'Nuevo Modelo', descripcion: '', ejemplo: ''}])} className="bg-purple-600 px-6 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shadow-lg"><Icons.Plus/> Crear Modelo</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {templates.map((t, i) => (
                                        <div key={t.id} className="glass-panel p-6 rounded-2xl space-y-4">
                                            <input value={t.nombre} onChange={e => { const n = [...templates]; n[i].nombre = e.target.value; setTemplates(n); }} className="w-full text-purple-400 font-black uppercase text-sm border-none bg-black/30" />
                                            <textarea value={t.descripcion} onChange={e => { const n = [...templates]; n[i].descripcion = e.target.value; setTemplates(n); }} placeholder="Define el formato esperado..." className="w-full h-24 text-xs" />
                                            <div className="bg-black/30 p-3 rounded-xl border border-slate-700">
                                                <label className="text-[9px] font-black text-slate-500 uppercase block mb-2">Entrenar con ejemplo (.pdf, .docx, .xlsx)</label>
                                                <input type="file" onChange={async e => {
                                                    const text = await extractText(e.target.files[0]);
                                                    const n = [...templates]; n[i].ejemplo = text.substring(0, 8000); setTemplates(n);
                                                    alert("Estilo aprendido del documento.");
                                                }} className="text-[10px] w-full" />
                                            </div>
                                            <button onClick={() => setTemplates(templates.filter(x => x.id !== t.id))} className="text-red-500 text-[10px] font-black uppercase flex items-center gap-2"><Icons.Trash/> Eliminar</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="max-w-2xl mx-auto space-y-8 fade-in pb-10">
                                {/* REUTILIZADO: CONFIGURACIÓN IA */}
                                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                                    <div className="flex items-center gap-4 mb-6 border-b border-slate-700 pb-4"><div className="p-3 bg-purple-500/20 rounded-xl text-purple-400"><Icons.Brain size={32} /></div><div><h2 className="text-2xl font-bold text-white">Configuración IA</h2><p className="text-slate-400 text-sm">Conexión con Google Gemini</p></div></div>
                                    
                                    <label className="block text-sm font-bold text-slate-300 mb-2">Gemini API Key</label>
                                    <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="AIzaSy..." className="w-full bg-black/50 border border-slate-600 rounded-xl p-4 font-mono mb-6" />

                                    <label className="block text-sm font-bold text-slate-300 mb-2 uppercase">Modelo IA Activo</label>
                                    <select value={aiModel} onChange={e => setAiModel(e.target.value)} className="w-full bg-slate-800 border border-slate-600 rounded-xl p-3 mb-6">
                                        {availableModels.map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>

                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-6">
                                        <label className="block text-[10px] font-bold text-slate-500 mb-2 uppercase">Añadir Nuevo ID de Modelo</label>
                                        <div className="flex gap-2">
                                            <input type="text" id="newModelInput" placeholder="Ej: gemini-2.0-flash" className="flex-1 text-xs" />
                                            <button onClick={() => { const inp = document.getElementById('newModelInput'); if(inp.value) { setAvailableModels([...availableModels, inp.value]); setAiModel(inp.value); inp.value=''; } }} className="bg-blue-600 px-4 rounded-lg text-xs font-bold uppercase">Añadir</button>
                                        </div>
                                    </div>

                                    {/* REUTILIZADO: TUTORIAL API */}
                                    <div className="p-6 bg-[#1e293b] border border-[#334155] rounded-xl">
                                        <h4 className="text-lg font-bold text-blue-400 mb-4">Manual de API Key</h4>
                                        <div className="space-y-4 text-xs text-slate-300 leading-relaxed">
                                            <p>1. Ve a <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-blue-400 font-bold underline">Google AI Studio</a>.</p>
                                            <p>2. Crea tu API Key (Gratis 15 req/min).</p>
                                            <p>3. Para modo ilimitado, asocia facturación en Cloud Console (pago por uso ínfimo).</p>
                                        </div>
                                    </div>
                                </div>

                                {/* REUTILIZADO: GDRIVE Y CLOUD */}
                                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                                    <h4 className="text-sm font-bold text-blue-400 mb-4 uppercase tracking-widest flex items-center gap-2"><Icons.Refresh size={16}/>Sincronización Cloud</h4>
                                    <input type="password" value={simpleDecrypt(gScriptUrl)} onChange={e => setGScriptUrl(simpleEncrypt(e.target.value))} placeholder="https://script.google.com/macros/s/..." className="w-full bg-black/50 border border-slate-600 rounded-xl p-3 font-mono text-xs mb-4" />
                                    <div className="grid grid-cols-2 gap-4">
                                        <button onClick={uploadToCloud} className="bg-blue-600 py-3 rounded-xl font-bold uppercase text-[10px]">Guardar en Drive</button>
                                        <button onClick={downloadFromCloud} className="bg-slate-700 py-3 rounded-xl font-bold uppercase text-[10px]">Cargar de Drive</button>
                                    </div>

                                    <div className="bg-slate-950/50 border border-slate-700 rounded-xl p-4 mt-6">
                                        <h5 className="text-xs font-bold text-white mb-3">Tutorial Sincronización</h5>
                                        <p className="text-[11px] text-slate-400">Pega el código en Google Apps Script, implementa como Aplicación Web y autoriza el acceso a Drive.</p>
                                        <pre className="bg-black text-green-500 p-2 text-[8px] mt-2 overflow-x-auto">
{`function doPost(e) {
  var data = JSON.parse(e.postData.contents);
  var file = DriveApp.getFilesByName("BG_AGENTS_DB.json").next();
  file.setContent(JSON.stringify(data));
  return ContentService.createTextOutput("OK");
}`}
                                        </pre>
                                    </div>
                                </div>

                                {/* REUTILIZADO: SEGURIDAD PIN */}
                                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                                    <h2 className="text-xl font-bold mb-4 flex items-center gap-3 text-red-400"><Icons.Eye size={32} /> Seguridad de Acceso</h2>
                                    <input type="password" value={appPin} onChange={e => setAppPin(e.target.value.replace(/\D/g,'').slice(0,4))} placeholder="PIN 4 dígitos" className="w-full bg-slate-800 border border-slate-600 rounded-xl p-4 text-center text-2xl tracking-[1em]" />
                                    <p className="text-[10px] text-slate-500 mt-2 italic text-center">Deja vacío para desactivar el bloqueo al inicio.</p>
                                </div>

                                {/* REUTILIZADO: ESTADO DEL SISTEMA / HASH */}
                                <div className="bg-slate-900/95 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                                    <h2 className="text-2xl font-bold text-white border-b border-slate-700 pb-4 mb-6">Estado del Sistema</h2>
                                    <div className="bg-black/30 p-5 rounded-xl border border-slate-700">
                                        <label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">Hash de Instalación</label>
                                        <div className="flex gap-3">
                                            <input type="text" id="licInput" placeholder="XXXX-XXXX" className="flex-1 bg-slate-900 border border-slate-600 rounded-lg p-3 text-white font-mono" />
                                            <button onClick={() => { const v = document.getElementById('licInput').value; if(_0x8f(v)) { _s_set(_0xT); alert("Validado."); } else { alert("Error."); } }} className="px-6 py-2 bg-blue-600 rounded-lg font-bold text-xs uppercase">Verificar</button>
                                        </div>
                                        {_0xAuth && <div className="mt-3 text-center text-green-400 text-xs font-bold uppercase tracking-widest">● SISTEMA ACTIVADO</div>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="shrink-0 bg-slate-900 border-t border-slate-800 py-1 px-6 flex justify-between items-center text-[8px] text-slate-600 font-bold uppercase tracking-widest">
                        <div>BoardingGate Agent 1.0 (SECURE)</div>
                        <div className="flex gap-4">
                            <span>Sinc: {syncStatus === 'synced' ? 'Nube OK' : 'Local'}</span>
                            <span>Licencia: {_0xAuth ? 'ACTIVA' : 'RESTRINGIDA'}</span>
                        </div>
                    </footer>
                </div>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
